<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#e8ebd9">
<link rel="icon" type="image/png" href="assets/brand/favicon.png">
<title>Bodega Lo Valledor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1ee; --panel:#f6f8f6; --card:#fff; --ink:#14201a; --muted:#7a857f; --line:#e4e9e5;
  --g900:#0a3d22; --g800:#0b5a30; --g700:#0b6b34; --g500:#2e9b55; --g300:#8fd19e; --lime:#8ccf00; --g100:#e5f4e8;
  --warn:#d98b00; --warn-bg:#fff4dc; --bad:#c8392b; --bad-bg:#fde8e5; --ok-bg:#e5f4e8;
  --soft:#eef1ee; --soft2:#f2f4f3; --hover:#fafcfa; --field:#fff; --mark:#e3f5c4; --glass:rgba(255,255,255,.55); --glass-card:rgba(255,255,255,.72); --glass-bd:rgba(255,255,255,.7); --blur:saturate(160%) blur(18px);
  --r:22px; --r-sm:14px; --sh:0 1px 2px rgba(10,40,20,.04);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;letter-spacing:-.02em}
.app{display:grid;grid-template-columns:240px 1fr;gap:14px;max-width:1440px;margin:0 auto;padding:14px;min-height:100vh}
/* sidebar */
.side{background:var(--panel);border-radius:var(--r);padding:22px 0;display:flex;flex-direction:column;position:sticky;top:14px;height:calc(100vh - 28px)}
.brand{display:flex;align-items:center;gap:10px;padding:0 22px 22px;font-weight:800;font-size:17px;line-height:1.1}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.navlbl{font-size:11px;color:var(--muted);padding:12px 26px 6px;text-transform:uppercase;letter-spacing:.06em}
.emoji-ic{display:inline-grid;place-items:center;width:1.25em;line-height:1;flex:none;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 26px;color:var(--muted);text-decoration:none;font-weight:500;position:relative;cursor:pointer}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink);font-weight:700}
.nav a.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--g700)}
.nav a.on svg{color:var(--g700)}
.nav svg{width:19px;height:19px;flex:none}
.side .promo{margin:auto 14px 0;border-radius:18px;padding:18px;color:#fff;background:radial-gradient(120% 90% at 100% 100%,#1f8b47 0,transparent 60%),linear-gradient(160deg,#0d2a19,#07170e);font-size:13px}
.side .promo b{font-size:16px;display:block;margin-bottom:4px}
/* main */
.main{background:var(--panel);border-radius:var(--r);padding:18px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.search{flex:1;max-width:340px;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:10px 16px;color:var(--muted)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--card);border:0;display:grid;place-items:center;cursor:pointer;flex:none;position:relative}
.iconbtn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.me{display:flex;align-items:center;gap:10px;margin-left:auto}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--g500),var(--g800));flex:none}
.me b{display:block;font-size:14px}.me span{font-size:12px;color:var(--muted)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:30px;font-weight:700}
.head p{margin:4px 0 0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:1.5px solid var(--g800);background:var(--card);color:var(--g800);font-weight:600;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--g800);color:#fff}
.btn.pri:hover{background:var(--g900)}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:34px;padding:0 14px;font-size:13px}
.btn.big{min-height:56px;font-size:16px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* grid & cards */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.span2{grid-column:span 2}.span3{grid-column:span 3}
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--sh);min-width:0}
.card h3{font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.kpi .lbl{font-weight:600;display:flex;justify-content:space-between;align-items:center}
.kpi .val{font-size:40px;font-weight:700;letter-spacing:-.03em;margin:14px 0 8px;line-height:1}
.kpi .sub{font-size:12px;color:var(--g700);display:flex;align-items:center;gap:6px}
.kpi .arrow{width:30px;height:30px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;opacity:.8}
.kpi.hero{color:#fff;background:linear-gradient(150deg,#1d7c45,#0b4a27)}
.kpi.hero .sub{color:#c9f0d3}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--g700);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:#f5c9c2}
.pill.mute{background:var(--soft2);color:var(--muted)}
.muted{color:var(--muted)}
.right{text-align:right}
.num{font-variant-numeric:tabular-nums}
/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.card.shortcut{cursor:pointer;transition:box-shadow .15s,border-color .15s}.card.shortcut:hover{box-shadow:0 0 0 2px var(--g500)}.card.shortcut:focus-visible{outline:3px solid var(--g500);outline-offset:2px}.rows .click{cursor:pointer}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--hover)}
.scroll{overflow-x:auto;margin:0 -6px;padding:0 6px}
/* bars chart (donezo striped) */
.bars{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:24px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;position:relative}
.bar i{display:block;width:100%;max-width:46px;border-radius:999px;min-height:46px;background:repeating-linear-gradient(135deg,#fff 0 4px,#9aa59f 4px 6px);border:1.5px solid #9aa59f}
.bar i.on{background:var(--g700);border-color:var(--g700)}
.bar i.on2{background:var(--g500);border-color:var(--g500)}
.bar i.today{background:var(--g900);border-color:var(--g900)}
.bar span{font-size:12px;color:var(--muted)}
.bar em{position:absolute;font-style:normal;font-size:10.5px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 5px;white-space:nowrap}
.gauge{display:flex;flex-direction:column;align-items:center}
.gauge .pct{font-size:40px;font-weight:700;margin-top:-62px}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted);margin-top:14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.rows>div{display:flex;align-items:center;gap:12px;padding:9px 0}
.rows>div+div{border-top:1px solid var(--line)}
.rows .grow{flex:1;min-width:0}
.rows .grow b{display:block;font-size:13.5px}
.rows .grow span{font-size:12px;color:var(--muted)}
.ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:700;font-size:13px}
.ico.t{background:#fde7e3;color:#c8392b}.ico.p{background:var(--g100);color:var(--g700)}.ico.o{background:var(--gold-bg);color:var(--gold-ink)}
.dark{color:#fff;background:radial-gradient(90% 80% at 80% 100%,#1f8b47 0,transparent 65%),linear-gradient(160deg,#0d2a19,#07170e)}
.dark .muted{color:#a9c3b2}
/* price strip */
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip b{display:block;font-size:14px}
.chip.on{background:var(--g800);color:#fff;border-color:var(--g800)}
.chip.flash{border-color:var(--g700)}
.chip.flash::after{content:"Precio actualizado";display:block;font-size:11px;color:var(--g700);margin-top:4px}
/* POS */
.pos{display:grid;grid-template-columns:1fr 360px;gap:14px;align-items:start}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.prod{background:var(--card);border:1.5px solid transparent;border-radius:18px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:120px}
.prod:hover{border-color:var(--g300)}
.prod .nm{font-weight:700;font-size:14.5px;line-height:1.2}
.prod .pr{font-size:18px;font-weight:800;color:var(--g800);margin-top:auto}
.prod .st{font-size:12px;color:var(--muted)}
.prod.out{opacity:.5}
.cart{position:sticky;top:14px}
.line{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.line .grow{flex:1;min-width:0}
.line small{color:var(--muted);display:block}
/* transferencias resaltadas en el historial, para revisarlas contra la cuenta */
.pay-tr{display:inline-block;padding:2px 8px;border-radius:999px;background:#dbeafe;color:#1e40af;font-weight:700}
.tbl tr.row-tr td:first-child{box-shadow:inset 4px 0 0 #3b82f6}
:root[data-theme="dark"] .pay-tr{background:#1e3a8a;color:#dbeafe}
.price-st{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.price-st .btn.sm{padding:4px 10px;min-height:32px}
.x{border:0;background:var(--soft2);width:30px;height:30px;border-radius:50%;cursor:pointer;flex:none}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:24px;margin:12px 0}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:10px 6px;cursor:pointer;font-weight:600;color:var(--muted);min-height:40px}
.seg button.on{background:var(--card);color:var(--g800);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* forms */
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.f label{font-size:12.5px;font-weight:600;color:var(--muted)}
.in{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;background:var(--field);outline:0}
.in:focus{border-color:var(--g500)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
textarea.in{padding:10px 14px;min-height:70px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:52px;height:52px;border-radius:16px;border:0;background:var(--g100);color:var(--g800);font-size:24px;font-weight:700;cursor:pointer;flex:none}
.stepper input{text-align:center;font-size:22px;font-weight:700;min-height:52px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.bigbtn{border:0;border-radius:var(--r);padding:26px 20px;text-align:left;cursor:pointer;background:var(--card);display:flex;flex-direction:column;gap:6px;min-height:130px}
.bigbtn b{font-size:20px}
.bigbtn.on{background:linear-gradient(150deg,#1d7c45,#0b4a27);color:#fff}
.bigbtn.on span{color:#c9f0d3}
.bigbtn span{color:var(--muted);font-size:13px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(8,25,15,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);border-radius:24px;width:100%;max-width:480px;max-height:calc(100vh - 32px);overflow:auto;padding:22px}
.modal.wide{max-width:720px}
.modal h2{font-size:20px;margin-bottom:4px}
.modal .acts{display:flex;gap:10px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--g900);color:#fff;padding:12px 20px;border-radius:999px;z-index:60;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px);text-align:center}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border-radius:18px;box-shadow:0 12px 32px rgba(10,40,20,.16);z-index:20;padding:6px;max-height:360px;overflow:auto}
.sug button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px;border-radius:12px;text-align:left;cursor:pointer;min-height:52px}
.sug button:hover{background:var(--g100)}
.sug .grow{flex:1;min-width:0}.sug small{display:block;color:var(--muted);font-size:12px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.gamchk{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:6px;cursor:pointer}
.gamchk:has(input:checked){border-color:var(--g700);background:var(--g100)}
.gamchk input{width:22px;height:22px;accent-color:var(--g700);flex:none}
.gamchk small{display:block;color:var(--muted);font-size:12px}
.gam-box{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px 8px;margin:10px 0;display:grid;gap:8px;min-width:0}
.gam-box legend{font-weight:700;font-size:13px;padding:0 6px}
.gam-row{display:flex;align-items:center;gap:10px}
.gam-row label{cursor:default}
.gam-row small{display:block;color:var(--muted);font-size:12px}
.stepper.sm{gap:6px}
.stepper.sm button{width:40px;height:40px;border-radius:12px;font-size:20px}
.stepper.sm button:disabled{opacity:.4;cursor:default}
.stepper.sm input{width:56px;min-height:40px;font-size:18px;padding:0 4px}
.gam-result{margin:0;font-size:14px;color:var(--g700)}
.gam-result.neg{color:var(--warn)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.bnav{display:none}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login .box{background:var(--card);border-radius:28px;padding:30px 24px;width:100%;max-width:400px;text-align:center}
.users{display:flex;flex-direction:column;gap:8px;margin:18px 0}
.users button{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:10px 14px;cursor:pointer;text-align:left;min-height:56px}
.users button.on{border-color:var(--g700);background:var(--g100)}
.pin{display:flex;justify-content:center;gap:12px;margin:14px 0}
.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--g700)}
.pin i.f{background:var(--g700)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto}
.pad button{height:58px;border-radius:18px;border:0;background:#f1f4f2;font-size:22px;font-weight:700;cursor:pointer}
.pad button:active{background:var(--g100)}
.err{color:var(--bad);font-size:13px;min-height:18px}
.print-only{display:none}
.doc{font-size:13px}.doc .hd{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--g700);padding-bottom:10px;margin-bottom:12px}

/* ===== efecto vidrio + tema oscuro ===== */
body{background:
  radial-gradient(40vw 40vw at 8% 10%,rgba(46,155,85,.28),transparent 70%),
  radial-gradient(35vw 35vw at 92% 18%,rgba(140,207,0,.22),transparent 70%),
  radial-gradient(45vw 45vw at 70% 95%,rgba(11,107,52,.22),transparent 70%),
  var(--bg);background-attachment:fixed}
.side,.main{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-bd)}
.card:not(.hero):not(.dark),.prod,.bigbtn:not(.on),.search,.iconbtn,.chip:not(.on),.login .box,.sug{background:var(--glass-card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-bd)}
.kpi.hero,.bigbtn.on{box-shadow:0 10px 30px rgba(11,90,48,.28),inset 0 1px 0 rgba(255,255,255,.18)}
.modal{background:var(--glass-card);backdrop-filter:saturate(160%) blur(28px);-webkit-backdrop-filter:saturate(160%) blur(28px);border:1px solid var(--glass-bd);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.ov{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.bnav{background:var(--glass-card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.btn:not(.pri){background:var(--glass-card)}
.prod{transition:transform .15s,box-shadow .15s}.prod:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(10,40,20,.1)}
@media (max-width:760px){.main{background:transparent;border:0;backdrop-filter:none;-webkit-backdrop-filter:none}}
@media print{body{background:#fff}.modal{background:#fff;backdrop-filter:none}}
:root[data-theme="dark"]{
  --bg:#07120c; --panel:#0e1c14; --card:#12241a; --ink:#e6efe9; --muted:#8fa398; --line:rgba(255,255,255,.09);
  --g800:#2e9b55; --g700:#4fbf72; --g500:#5fcf82; --g900:#1d7c45; --g100:rgba(79,191,114,.14); --g300:#2e9b55;
  --warn:#f0b54a; --warn-bg:rgba(240,181,74,.13); --bad:#ff7a6b; --bad-bg:rgba(255,122,107,.13); --ok-bg:rgba(79,191,114,.13);
  --soft:rgba(255,255,255,.06); --soft2:rgba(255,255,255,.08); --hover:rgba(255,255,255,.04); --field:rgba(0,0,0,.25); --mark:rgba(140,207,0,.3);
  --glass:rgba(16,32,23,.55); --glass-card:rgba(22,42,30,.6); --glass-bd:rgba(255,255,255,.08);
  color-scheme:dark;
}
:root[data-theme="dark"] body{background:
  radial-gradient(40vw 40vw at 8% 10%,rgba(46,155,85,.25),transparent 70%),
  radial-gradient(35vw 35vw at 92% 18%,rgba(140,207,0,.12),transparent 70%),
  radial-gradient(45vw 45vw at 70% 95%,rgba(11,107,52,.3),transparent 70%),
  var(--bg);background-attachment:fixed}
:root[data-theme="dark"] .btn.pri{background:#1d7c45;border-color:#2e9b55}
:root[data-theme="dark"] .btn.pri:hover{background:#2e9b55}
:root[data-theme="dark"] .pill.ok{border-color:rgba(79,191,114,.25)}
:root[data-theme="dark"] .pill.warn{border-color:rgba(240,181,74,.25)}
:root[data-theme="dark"] .pill.bad{border-color:rgba(255,122,107,.25)}
:root[data-theme="dark"] .ico.t{background:rgba(255,122,107,.15);color:#ff8f82}
:root[data-theme="dark"] .ico.o{background:rgba(240,181,74,.15);color:#f0b54a}
:root[data-theme="dark"] .seg button.on{box-shadow:none;background:rgba(255,255,255,.1)}
:root[data-theme="dark"] .x{color:var(--ink)}
:root[data-theme="dark"] .tbl tr.click:hover td{background:var(--hover)}

/* ===== tema oscuro: verde neón ===== */
:root[data-theme="dark"]{--g800:#22b04b;--g700:#3fdc6a;--g500:#5ff08a;--g900:#178a3a;--lime:#9cff3c;--glass:rgba(6,22,12,.72);--glass-card:rgba(14,40,22,.62);--glass-bd:rgba(80,230,120,.16)}
:root[data-theme="dark"] body{background:

/* Skills: Impeccable + make-interfaces-feel-better. Identidad LMA Agro Comercial: verde bosque + dorado del logo. */
:root {
  --r:16px; --r-sm:10px; --sh:none;
  --bg:#f3f1e7; --panel:#f9f8f2; --card:#fff; --field:#fff; --ink:#14231a; --muted:#5d6455; --line:#e2ddcc;

  --g900:#082c12; --g800:#14501f; --g700:#1d6a2b; --g500:#3f8a1c; --g300:#b9d98a; --g100:#e9f1da; --lime:#70ba02; --ok-bg:#e9f1da;

  --gold:#d9a20c; --gold-soft:#f2c94c; --gold-ink:#7d5300; --gold-bg:#fbf1d2;

}

  --gold:#e6bd55;--gold-soft:#e6bd55;--gold-ink:#e6bd55;--gold-bg:rgba(230,189,85,.13);

/* transitions.dev: modal open / close */
:root {
  --modal-open-dur: 250ms;
  --modal-close-dur: 150ms;
  --modal-scale: 0.96;
  --modal-scale-close: 0.96;
  --modal-ease: cubic-bezier(0.22, 1, 0.36, 1);
}

.t-modal {
  transform-origin: center;
  transform: scale(var(--modal-scale));
  opacity: 0;
  pointer-events: none;
  transition:
    transform var(--modal-open-dur) var(--modal-ease),
    opacity   var(--modal-open-dur) var(--modal-ease);
  will-change: transform, opacity;
}
.t-modal.is-open {
  transform: scale(1);
  opacity: 1;
  pointer-events: auto;
}
.t-modal.is-closing {
  transform: scale(var(--modal-scale-close));
  opacity: 0;
  pointer-events: none;
  transition:
    transform var(--modal-close-dur) var(--modal-ease),
    opacity   var(--modal-close-dur) var(--modal-ease);
}

@media (prefers-reduced-motion: reduce) {
  .t-modal { transition: none !important; }
}


/* Mobile-native + Emil: usable controls, safe areas and resilient content. */
html {-webkit-text-size-adjust:100%;scroll-padding-block:20px}

body.dialog-open {overflow:hidden}
.modal,.sug,.side {overscroll-behavior:contain}
/* Tables scroll sideways; vertical wheel/touch must continue scrolling the page or dialog. */
.scroll {overscroll-behavior-x:contain;overscroll-behavior-y:auto}
button,a[role="button"],[role="button"] {touch-action:manipulation;user-select:none;-webkit-user-select:none}

const qtyFmt=(q,u)=>u==='kg'?kg(q)+' kg':Math.round(q).toLocaleString('es-CL')+' gam.';
const pad2=n=>String(n).padStart(2,'0');

function fifo(prodId,qty,until=Infinity){
  const out=[];let rest=qty;
  for(const l of prodLots(prodId)){
    if(rest<=1e-9)break;
    const s=lotStock(l.id,until);if(s<=1e-9)continue;
    const take=Math.min(s,rest);out.push({lot:l.id,qty:take});rest-=take;
  }
  return rest>1e-9?null:out;
}

function makeSale({vendedor,items,pago,pagoEf,fecha,silent,documento='boleta',receptor=null,cliente='',gamelas=null}){
  if(!['boleta','factura'].includes(documento))throw new Error('Selecciona boleta o factura.');
  if(!['efectivo','transferencia','tarjeta','mixto','credito'].includes(pago))throw new Error('Selecciona un medio de pago válido.');
  if(pago==='credito'&&!liveClients().some(c=>c.id===cliente))throw new Error('Elige el cliente del crédito.');
  if(documento==='factura'){
    const error=invoiceRecipientError(receptor);if(error)throw new Error(error);
    receptor=Object.fromEntries(['rut','razonSocial','giro','direccion','comuna','telefono'].map(key=>[key,key==='rut'?cleanRut(receptor[key]):String(receptor[key]||'').trim()]));
  }
  if(!items?.length)throw new Error('Agrega al menos un producto.');
  fecha=fecha||now();
  const reserved=new Map();
  const sale={id:uid('v'),num:S.sales.length+1001,fecha,vendedor,documento,receptor:documento==='factura'?{...receptor}:null,cliente:cliente||'',lineas:[],estado:'vigente',pagos:[],cierre:''};
  for(const it of items){
    const p=P(it.prod),devGam=!!p?.envase&&Number(it.qty)<0;
    if(!p||!p.activo||!Number.isFinite(Number(it.qty))||Number(it.qty)<=0&&!devGam)throw new Error('Revisa los productos y cantidades.');
    const qty=p.unidad==='kg'?round2(it.qty):Math.round(it.qty);
    if(qty<=0&&!devGam)throw new Error('La cantidad debe ser mayor que cero.');
    // gamelas que trae el cliente de más: línea negativa que descuenta de la compra y devuelve stock al lote de gamelas
    // el stock de gamelas es informativo: nunca bloquea una venta (si no cuadra, queda negativo hasta cargar el conteo real)
    const alloc=devGam?[{lot:gamelaReturnLot(fecha).id,qty}]:reserveFifo(p.id,qty,fecha,reserved)||(p.envase?[{lot:gamelaReturnLot(fecha).id,qty}]:null);
    if(!alloc)throw new Error(`No alcanza el stock de ${p.nombre}. Quedan ${qtyFmt(prodStock(p.id),p.unidad)}.`);
    const precio=it.precioEsp&&!p.envase&&Number.isSafeInteger(it.precio)&&it.precio>0?it.precio:p.precio;
    sale.lineas.push({prod:p.id,unidad:p.unidad,qty,precio,...(precio!==p.precio?{precioNormal:p.precio}:{}),subtotal:Math.round(qty*precio),allocs:alloc.map(a=>{const lot=S.lots.find(l=>l.id===a.lot);return {...a,comision:lotCommission(lot),costo:lot?.costo||0}})});
  }
  sale.total=sale.lineas.reduce((a,l)=>a+l.subtotal,0);
  if(sale.total<=0)throw new Error('El descuento por gamelas tiene que ser menor que la compra.');
  if(gamelas)sale.gamelas={lleva:gamelas.lleva,trae:gamelas.trae};
  if(pago==='mixto'){const ef=Math.min(pagoEf||0,sale.total);sale.pagos=[{medio:'efectivo',monto:ef},{medio:'transferencia',monto:sale.total-ef}]}
  else sale.pagos=[{medio:pago,monto:sale.total}];
  sale.lineas.forEach(ln=>ln.allocs.forEach(a=>S.moves.push({id:uid('m'),lot:a.lot,prod:ln.prod,tipo:'venta',qty:-a.qty,user:vendedor,fecha,motivo:'',ref:sale.id})));
  sale.comprobante=receiptData(sale);
  S.sales.push(sale);
  if(!silent)save();
  return sale;
}

let controlId=0;
function enhanceControls(root){
  // Native controls keep their native keyboard handling; custom click targets need it explicitly.
  root.querySelectorAll('[onclick]').forEach(el=>{
    if(el.matches('button,input,select,textarea,a[href]'))return;
    // A propagation boundary is not an action; preserve native table semantics.
    if(/^event\.stopPropagation\(\);?$/.test(el.getAttribute('onclick')?.trim()||''))return;
    if(!el.matches('tr,td,th'))el.setAttribute('role','button');
    el.tabIndex=0;
    if(el.matches('.nav a,.bnav a')&&el.classList.contains('on'))el.setAttribute('aria-current','page');
    el.addEventListener('keydown',e=>{
      if(e.target!==el)return;
      if(e.key===' '){e.preventDefault();return}
      if(e.key==='Enter'&&!e.repeat){e.preventDefault();el.click()}
    });
    el.addEventListener('keyup',e=>{
      if(e.target===el&&e.key===' '){e.preventDefault();el.click()}
    });
  });
  root.querySelectorAll('.f').forEach(field=>{
    const label=field.querySelector('label'),input=field.querySelector('input,select,textarea');
    if(label&&input&&!label.contains(input)){if(!input.id)input.id='control-'+(++controlId);label.htmlFor=input.id}
  });
  root.querySelectorAll('input[placeholder]:not([aria-label])').forEach(input=>{
    if(!input.labels?.length)input.setAttribute('aria-label',input.placeholder);
  });
  root.querySelectorAll('button[title]').forEach(button=>button.setAttribute('aria-label',button.title));
  root.querySelectorAll('.seg button,.themes button,.tabs button,.chip[onclick]').forEach(button=>{
    button.setAttribute('aria-pressed',String(button.classList.contains('on')||button.matches('.tabs .pri')));
  });
  root.querySelectorAll('.err').forEach(el=>{el.setAttribute('role','alert');el.setAttribute('aria-atomic','true')});
  root.querySelectorAll('svg').forEach(svg=>{svg.setAttribute('aria-hidden','true');svg.setAttribute('focusable','false')});
  root.querySelectorAll('.scroll').forEach(el=>{
    el.tabIndex=0;el.setAttribute('role','region');el.setAttribute('aria-label','Tabla con desplazamiento horizontal');
  });
  root.querySelectorAll('th').forEach(el=>el.setAttribute('scope','col'));
}

function cartQty(pid){return pid===gamId()?Math.max(0,gamCalc().net):ui.cart.filter(c=>c.prod===pid).reduce((a,c)=>a+c.qty,0)}
const cleanRut=value=>String(value||'').replace(/[.\s]/g,'').toUpperCase();
function validRut(value){
  const rut=cleanRut(value);if(!/^\d{1,8}-[0-9K]$/.test(rut))return false;
  const [body,dv]=rut.split('-');if(Number(body)===0)return false;
  let sum=0,factor=2;for(let i=body.length-1;i>=0;i--){sum+=Number(body[i])*factor;factor=factor===7?2:factor+1}
  const remainder=11-sum%11;return dv===(remainder===11?'0':remainder===10?'K':String(remainder));
}
function invoiceRecipientError(receptor){
  if(!receptor||!validRut(receptor.rut))return 'Ingresa un RUT válido del cliente para la factura, con guion y dígito verificador.';
  for(const [key,label,max]of [['razonSocial','razón social',100],['giro','giro',80],['direccion','dirección',70],['comuna','comuna',20]]){
    const value=String(receptor[key]||'').trim();
    if(!value)return 'Completa '+label+' del cliente para la factura.';
    if(value.length>max)return 'El campo '+label+' admite hasta '+max+' caracteres.';
  }
  return '';
}

function receiptPdfLines(s){
  const d=receiptData(s),e=d.emisor,lines=[];
  const add=(text='',bold=false,center=false)=>{
    for(const paragraph of String(text).split(/\r?\n/)){
      const words=paragraph.split(/\s+/);let current='';
      for(let word of words){
        if(current&&current.length+word.length+1>38){lines.push({text:current,bold,center});current=''}
        while(word.length>38){if(current){lines.push({text:current,bold,center});current=''}lines.push({text:word.slice(0,38),bold,center});word=word.slice(38)}
        current+=(current?' ':'')+word;
      }
      lines.push({text:current,bold,center});
    }
  };
  const pair=(left,right,bold=false)=>{
    const room=38-right.length;
    if(left.length>room-1){add(left,bold);add(right.padStart(38,' '),bold)}
    else lines.push({text:left+' '.repeat(Math.max(1,room-left.length))+right,bold,center:false});
  };
  add(e.nombre,true,true);add('RUT '+e.rut,false,true);
  for(const text of [e.giro,e.direccion,e.comuna])if(text)add(text,false,true);
  add();add(receiptTitle(s),true,true);add('Comprobante interno N° '+s.num,false,true);
  add('DOCUMENTO NO VÁLIDO TRIBUTARIAMENTE',true,true);
  if(s.estado==='anulada'){add('VENTA ANULADA',true,true);add(s.motivoAnula||'')}
  add();add('Emisión: '+fdt(s.fecha));add('Vendedor: '+d.vendedor);
  if(d.receptor){add();add('CLIENTE',true);add(d.receptor.razonSocial);add('RUT '+d.receptor.rut);add(d.receptor.giro);add(d.receptor.direccion+', '+d.receptor.comuna);if(d.receptor.telefono)add('Teléfono: '+d.receptor.telefono)}
  add('-'.repeat(38));
  for(const l of d.items){add(l.nombre,true);pair(qtyFmt(l.qty,l.unidad)+' x '+clp(l.precio),clp(l.subtotal));add()}
  add('-'.repeat(38));pair('Neto referencial',clp(d.neto));pair('IVA 19% referencial',clp(d.iva));pair('TOTAL',clp(d.total),true);add();
  for(const p of d.pagos.filter(p=>p.monto))pair(payLabel(p),clp(p.monto));
  add('-'.repeat(38));add('Precios finales con IVA incluido.',false,true);add('Desglose referencial: todos los productos se consideran afectos.',false,true);add();
  add('Sin folio autorizado ni timbre SII.',true,true);add('Conserva este comprobante de tu compra.',false,true);
  return lines;
}

  }).join('');
  const lines=receiptPdfLines(s),pages=[];
  for(let i=0;i<lines.length;i+=66)pages.push(lines.slice(i,i+66));
  const objects=[],put=text=>{objects.push(text);return objects.length};
  put('<< /Type /Catalog /Pages 2 0 R >>');put('');
  const regular=put('<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>');
  const bold=put('<< /Type /Font /Subtype /Type1 /BaseFont /Courier-Bold /Encoding /WinAnsiEncoding >>');
  const pageIds=[];
  for(const [index,part]of pages.entries()){
    const height=Math.max(220,part.length*11+48),width=226.77;
    let stream='0 g\n';
    part.forEach((l,i)=>{const x=l.center?Math.max(14,(width-l.text.length*5.1)/2):14;
      stream+=`BT /${l.bold?'F2':'F1'} 8.5 Tf 1 0 0 1 ${x.toFixed(2)} ${(height-22-i*11).toFixed(2)} Tm <${hex(l.text)}> Tj ET\n`;
    });
    stream+=`BT /F1 7 Tf 1 0 0 1 14 12 Tm <${hex('Página '+(index+1)+' de '+pages.length)}> Tj ET\n`;
    const content=put(`<< /Length ${stream.length} >>\nstream\n${stream}endstream`);
    pageIds.push(put(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${width} ${height}] /Resources << /Font << /F1 ${regular} 0 R /F2 ${bold} 0 R >> >> /Contents ${content} 0 R >>`));
  }
  objects[1]=`<< /Type /Pages /Count ${pageIds.length} /Kids [${pageIds.map(id=>id+' 0 R').join(' ')}] >>`;
  let pdf='%PDF-1.4\n',offsets=[0];
  objects.forEach((body,i)=>{offsets.push(pdf.length);pdf+=`${i+1} 0 obj\n${body}\nendobj\n`});
  const xref=pdf.length;
  pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`+offsets.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  return new Uint8Array(Array.from(pdf,c=>c.charCodeAt(0)));
}
function downloadReceiptPDF(id){

async function shareReceipt(id){

    const notice=document.querySelector('#receipt-share-status');

  };
  if(globalThis.isSecureContext===false){
    notify('Para compartir el PDF en WhatsApp, abre esta página mediante HTTPS en un navegador compatible.');return;
  }
  if(typeof File==='undefined'||typeof navigator==='undefined'||!navigator.share||!navigator.canShare){

    if(error.name==='AbortError')return;

function receptionImageStore(mode,key,value){
  return new Promise((resolve,reject)=>{
    if(typeof indexedDB==='undefined'){reject(new Error('Este navegador no permite guardar imágenes.'));return}
    const request=indexedDB.open('bodegaLV.attachments',1);
    request.onupgradeneeded=()=>request.result.createObjectStore('images');
    request.onerror=()=>reject(new Error('No se pudo abrir el almacenamiento de imágenes.'));
    request.onsuccess=()=>{const db=request.result;let result;
      const tx=db.transaction('images',mode==='get'?'readonly':'readwrite'),store=tx.objectStore('images');
      const op=mode==='get'?store.get(key):mode==='delete'?store.delete(key):store.put(value,key);
      op.onsuccess=()=>{result=op.result};tx.oncomplete=()=>{db.close();resolve(result)};
      tx.onerror=tx.onabort=()=>{db.close();reject(new Error('No se pudo guardar o recuperar la imagen.'))};
    };
  });
}

function voidRec(id){
  askReason('Anular recepción','Se descontará del stock lo que aún quede de estos lotes.',m=>{
    const r=S.receptions.find(x=>x.id===id);

    r.lineas.forEach(l=>S.moves.push({id:uid('m'),lot:l.lot,prod:l.prod,tipo:'anulación',qty:-l.qty,user:me.id,fecha:now(),motivo:m,ref:r.id}));

    r.anulada=true;audit('Anula recepción','Recepción '+PR(r.productor).nombre,'vigente','anulada: '+m);save();closeModal();render();toast('Recepción anulada');

let mermaF={prod:'',qty:''};
function mermaView(){
  if(!mermaF.prod)mermaF.prod=S.products.find(p=>p.activo&&!p.envase)?.id;
  const p=P(mermaF.prod),available=prodStock(p.id),q=Number(mermaF.qty);
  return `<div class="card"><h3>Registrar merma</h3><div class="f"><label for="waste-product">Producto</label><select id="waste-product" class="in" onchange="mermaF.prod=this.value;mermaF.qty='';render()">${S.products.filter(x=>x.activo&&!x.envase).map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.nombre)}</option>`).join('')}</select></div>
  <p class="muted">Disponible: ${qtyFmt(available,p.unidad)}</p><div class="f"><label for="waste-qty">Cantidad que se bota (${p.unidad==='kg'?'kg':'gamelas'})</label><input id="waste-qty" class="in num" type="text" inputmode="decimal" autocomplete="off" value="${String(mermaF.qty).replace('.',',')}" onchange="mermaF.qty=decIn(this.value);render()"></div>
  ${q>available?'<p class="err">La cantidad supera el stock disponible.</p>':''}<button class="btn pri big" ${!Number.isFinite(q)||q<=0||q>available?'disabled':''} onclick="saveMerma()">Confirmar merma</button></div>`;
}
function saveMerma(){
  try{workflowTransaction(()=>{workflowUser();const p=P(mermaF.prod),raw=Number(decIn(mermaF.qty)),q=p.unidad==='kg'?round2(raw):raw;
    if(!Number.isFinite(q)||q<=0||p.unidad!=='kg'&&!Number.isInteger(q)||q>prodStock(p.id)+1e-9)throw new Error('Ingresa una cantidad válida dentro del stock disponible.');
    let remaining=q;const ref=uid('merma'),fecha=now();for(const lot of prodLots(p.id)){const take=Math.min(remaining,Math.max(0,lotStock(lot.id)));if(take>0){S.moves.push({id:uid('m'),lot:lot.id,prod:p.id,tipo:'merma',qty:-take,user:me.id,fecha,motivo:'Merma registrada',ref});remaining=round2(remaining-take)}if(remaining<=0)break}
    if(remaining>1e-9)throw new Error('No se pudo asignar la merma a los lotes disponibles.');
  });mermaF.qty='';render();toast('Merma registrada.')}catch(e){toast(e.message)}
}

function saveProduct(pid){
  const g=id=>$('#'+id);const d={sku:g('e_sku').value.trim().toUpperCase(),nombre:g('e_nom').value.trim(),familia:g('e_fam').value,calibre:g('e_cal').value.trim()||'—',unidad:g('e_uni').value,pesoCaja:0,usaGamela:g('e_gam').checked,activo:g('e_act').checked};
  if(!d.familia||d.familia==='Otros'){toast('Selecciona una familia identificada.');return}
  if(!d.sku||!d.nombre){toast('SKU y nombre son obligatorios');return}
  if(S.products.some(x=>x.sku===d.sku&&x.id!==pid)){toast('Ese SKU ya existe');return}
  const pr=+g('e_pre').value;if(!(pr>0)){toast('Ingresa el precio');return}
  if(pid){const p=P(pid);
    if(pr!==p.precio){S.prices.push({prod:pid,precio:pr,desde:now(),user:me.id});audit('Cambio de precio',p.nombre,clp(p.precio),clp(pr));flashSku=pid}
    const ch=Object.keys(d).filter(k=>String(p[k])!==String(d[k]));
    if(ch.length)audit('Edita producto',p.nombre,ch.map(k=>k+': '+p[k]).join(', '),ch.map(k=>k+': '+d[k]).join(', '));
    Object.assign(p,d,{precio:pr})}
  else{S.products.push({id:uid('p'),...d,precio:pr});audit('Crea producto',d.nombre,'',clp(pr))}
  save();closeModal();render();toast('Producto guardado');
}

/* Historial: una sola lista de ventas para todos.
   Vendedor: solo sus ventas. Luis: todas, con anular y recepciones. Contadora: todas, solo lectura.
   Filtros de periodo, documento (boleta/factura), vendedor, medio y producto; totales con neto y descarga del reporte. */
let sf={desde:'',hasta:'',vend:'',medio:'',doc:''};
function viewSales(){
  const t=isAccountant()?'list':ui.salesTab;
  return head('Historial','',isAdmin()||isAccountant()?`<button class="btn pri" onclick="exportSales()">${ic('print',17)}Descargar reporte</button>`:'')+
  (isAccountant()?'':`<div class="tabs"><button class="btn sm ${t!=='recepciones'?'pri':'ghost'}" onclick="ui.salesTab='list';render()">Ventas</button><button class="btn sm ${t==='recepciones'?'pri':'ghost'}" onclick="ui.salesTab='recepciones';render()">Recepciones</button></div>`)+
  (t==='recepciones'?receptionHistory():salesList());
}
function salesRows(){
  let ss=S.sales.filter(s=>isAdmin()||isAccountant()||s.vendedor===me.id);
  if(sf.desde)ss=ss.filter(s=>dayKey(s.fecha)>=sf.desde);
  if(sf.hasta)ss=ss.filter(s=>dayKey(s.fecha)<=sf.hasta);
  if(sf.vend)ss=ss.filter(s=>s.vendedor===sf.vend);
  if(sf.medio)ss=ss.filter(s=>s.pagos.some(p=>p.medio===sf.medio&&p.monto));
  if(sf.doc)ss=ss.filter(s=>(receiptKind(s)==='Factura'?'factura':'boleta')===sf.doc);
  if(ui.q){const q=ui.q.toLowerCase();ss=ss.filter(s=>s.lineas.some(l=>{const p=P(l.prod);return p.nombre.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)}))}
  return ss.sort((a,b)=>b.fecha-a.fecha);
}

    ${seeAll?`<div class="f"><label>Vendedor</label><select class="in" onchange="setSf('vend',this.value)"><option value="">Todos</option>${S.users.filter(u=>u.rol!=='contador').map(u=>`<option value="${u.id}" ${sf.vend===u.id?'selected':''}>${esc(u.nombre)}</option>`).join('')}</select></div>`:''}
    <div class="f"><label>Medio de pago</label><select class="in" onchange="setSf('medio',this.value)"><option value="">Todos</option>${['efectivo','transferencia','tarjeta','credito'].map(m=>`<option ${sf.medio===m?'selected':''} value="${m}">${receiptPayment(m)}</option>`).join('')}</select></div>

  <div class="card" style="margin-top:14px">

let lf={prod:'',desde:'',hasta:''};
function liqCalc(prodId,desde,hasta){
  const lots=S.lots.filter(l=>l.productor===prodId&&l.modalidad==='consignación'&&!S.receptions.find(r=>r.id===l.rec)?.anulada);
  const ids=new Set(lots.map(l=>l.id));const inR=t=>(!desde||dayKey(t)>=desde)&&(!hasta||dayKey(t)<=hasta);
  const by={};const add=(pid)=>by[pid]||(by[pid]={recibido:0,vendido:0,monto:0,merma:0});
  lots.filter(l=>inR(l.fecha)).forEach(l=>add(l.prod).recibido+=l.qty);
  revenueEntries().filter(s=>inR(s.fecha)).forEach(s=>s.lineas.forEach(ln=>ln.allocs.forEach(a=>{if(ids.has(a.lot)){const r=add(ln.prod);r.vendido+=a.qty;r.monto+=(s.entrySign||1)*Math.round(Math.abs(a.qty)*ln.precio);r.comision=(r.comision||0)+(s.entrySign||1)*Math.round(Math.round(Math.abs(a.qty)*ln.precio)*(a.comision??lotCommission(S.lots.find(l=>l.id===a.lot)))/100)}})));
  S.moves.filter(m=>m.tipo==='merma'&&ids.has(m.lot)&&inR(m.fecha)).forEach(m=>add(m.prod).merma+=-m.qty);
  const pr=PR(prodId);const monto=Object.values(by).reduce((a,r)=>a+r.monto,0);const com=Object.values(by).reduce((n,r)=>n+(r.comision||0),0);
  return {by,monto,comision:com,neto:monto-com,pct:monto?Math.round(com/monto*1000)/10:0};
}

/* ---------- BALANCE: cuánto queda en el bolsillo ---------- */
function monthStats(mk){
  const lot=Object.fromEntries(S.lots.map(l=>[l.id,l]));
  const r={mk,ventas:0,n:0,propias:0,costoVendido:0,consig:0,comision:0,gamVend:0,gamVendN:0,gamCob:0,gamCobN:0,gamDev:0,gamDevN:0,byProd:{},merma:{}};
  revenueEntries().filter(s=>monthKey(s.fecha)===mk).forEach(s=>{
    r.ventas+=s.total;if(s.entrySign!==-1)r.n++;
    s.lineas.forEach(ln=>{
      const b=r.byProd[ln.prod]||(r.byProd[ln.prod]={qty:0,monto:0});b.qty+=ln.qty;b.monto+=ln.subtotal;
      if(P(ln.prod).envase){r.gamVend+=ln.subtotal;r.gamVendN+=ln.qty;if(ln.qty*(s.entrySign||1)>0){r.gamCob+=ln.subtotal;r.gamCobN+=ln.qty}else{r.gamDev-=ln.subtotal;r.gamDevN-=ln.qty}return}
      ln.allocs.forEach(a=>{const l=lot[a.lot],m=(s.entrySign||1)*Math.round(Math.abs(a.qty)*ln.precio);
        if(l&&l.modalidad==='consignación'){r.consig+=m;r.comision+=(s.entrySign||1)*Math.round(Math.abs(m)*(a.comision??lotCommission(l))/100)}
        else{r.propias+=m;r.costoVendido+=(s.entrySign||1)*Math.round(Math.abs(a.qty)*(a.costo??l?.costo??0))}});
    });
  });
  S.moves.filter(m=>m.tipo==='merma'&&monthKey(m.fecha)===mk).forEach(m=>r.merma[m.prod]=(r.merma[m.prod]||0)-m.qty);
  r.compras=S.receptions.filter(x=>!x.anulada&&x.modalidad==='compra'&&monthKey(x.fecha)===mk).reduce((a,x)=>a+x.lineas.reduce((b,l)=>b+l.qty*l.costo,0),0);
  r.fijos=fixedFor(mk);r.vars=varFor(mk);
  r.gamComp=r.vars.filter(e=>e.cantidad).reduce((a,e)=>a+e.monto,0);r.gamCompN=r.vars.filter(e=>e.cantidad).reduce((a,e)=>a+e.cantidad,0);
  r.tFijos=r.fijos.reduce((a,f)=>a+f.monto,0);r.tVars=r.vars.reduce((a,e)=>a+e.monto,0);
  r.ingresos=r.propias+r.comision+r.gamVend;
  r.egresos=r.compras+r.tFijos+r.tVars;
  r.bolsillo=r.ingresos-r.egresos;
  r.devolucionesPendientes=(S.refunds||[]).filter(x=>x.state!=='confirmada_manual').reduce((n,x)=>n+x.amount,0);
  return r;
}
let bm='';
function viewBal(){
  if(!bm)bm=monthKey(now());
  const b=monthStats(bm);
  const row=(t,sub,v,neg)=>`<div><div class="grow"><b>${t}</b>${sub?`<span>${sub}</span>`:''}</div><b class="num" style="color:${neg?'var(--bad)':'var(--g700)'}">${neg?'− ':'+ '}${clp(v)}</b></div>`;

let rp='mes';

  const u={};Object.entries(st.byProd).forEach(([pid,b])=>{const p=P(pid);const k=p.envase?'Gamelas (envase)':p.familia;const x=u[k]||(u[k]={qty:0,unidad:p.unidad});x.qty+=b.qty});
  return u;
}
function viewRep(){
  const months=[...new Set(revenueEntries().map(s=>monthKey(s.fecha)))].sort().reverse();
  const ms=months.map(monthStats),reportFamilies=[...productFamilies(),...(S.products.some(p=>!p.envase&&p.familia==='Otros')?['Otros']:[])];
  const fmtK={dia:t=>dayKey(t),semana:t=>{const d=new Date(t);const o=new Date(d.getFullYear(),0,1);return d.getFullYear()+'-S'+pad2(Math.ceil(((d-o)/DAY+o.getDay()+1)/7))},mes:t=>dayKey(t).slice(0,7),año:t=>dayKey(t).slice(0,4)}[rp];
  const g={};revenueEntries().forEach(s=>{const k=fmtK(s.fecha);(g[k]||(g[k]={v:0,n:0,gam:0,kg:0})).v+=s.total;if(s.entrySign!==-1)g[k].n++;s.lineas.forEach(l=>{if(P(l.prod).envase)return;l.unidad==='kg'?g[k].kg+=l.qty:g[k].gam+=l.qty})});
  const keys=Object.keys(g).sort().reverse();
  const top={};revenueEntries().forEach(s=>s.lineas.forEach(l=>{top[l.prod]=(top[l.prod]||0)+l.subtotal}));
  const topL=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,6);const tmax=topL[0]?.[1]||1;
  return head('Reportes','Cierre de cada mes con todas sus cantidades, para comparar más adelante.',`<button class="btn" onclick="exportCSV()">Exportar ventas</button><button class="btn" onclick="exportMonths()">Exportar cierres</button>`)+
  `<div class="card"><h3>Cierres de mes</h3><div class="scroll"><table class="tbl"><thead><tr><th>Mes</th><th class="right">Ventas</th><th class="right">N° ventas</th>${reportFamilies.map(f=>`<th class="right">${esc(f==='Otros'?'Sin clasificar':f)}</th>`).join('')}<th class="right">Gamelas (envase)</th><th class="right">Bolsillo</th></tr></thead><tbody>
  ${ms.map(m=>{const u=unitTotals(m);const c=k=>u[k]?qtyFmt(u[k].qty,u[k].unidad):'—';return `<tr class="click" onclick="monthDetail('${m.mk}')"><td><b>${monthName(m.mk)}</b>${m.mk===monthKey(now())?' <span class="pill warn">en curso</span>':''}</td><td class="right num"><b>${clp(m.ventas)}</b></td><td class="right num">${m.n}</td>${reportFamilies.map(f=>`<td class="right num">${c(f)}</td>`).join('')}<td class="right num">${c('Gamelas (envase)')}</td><td class="right num" style="color:${m.bolsillo<0?'var(--bad)':'var(--g700)'}"><b>${clp(m.bolsillo)}</b></td></tr>`}).join('')||'<tr><td colspan="8" class="empty">Aún no hay ventas</td></tr>'}
  </tbody></table></div><p class="muted" style="font-size:12px;margin:8px 0 0">Toca un mes para ver el detalle por producto.</p></div>
  <div class="grid g3" style="margin-top:14px"><div class="card span2"><h3>Ventas por periodo<span class="seg" style="max-width:340px;flex:1">${['dia','semana','mes','año'].map(p=>`<button class="${rp===p?'on':''}" onclick="rp='${p}';render()">${p==='dia'?'Día':p[0].toUpperCase()+p.slice(1)}</button>`).join('')}</span></h3>
    <div class="scroll"><table class="tbl"><thead><tr><th>Periodo</th><th class="right">Ventas</th><th class="right">N°</th><th class="right">Gamelas</th><th class="right">Kg</th></tr></thead><tbody>${keys.map(k=>`<tr><td><b>${k}</b></td><td class="right num">${clp(g[k].v)}</td><td class="right num">${g[k].n}</td><td class="right num">${g[k].gam}</td><td class="right num">${kg(g[k].kg)}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="card"><h3>Más vendidos</h3>${topL.map(([pid,v])=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px"><b>${esc(P(pid).nombre)}</b><span class="num">${clp(v)}</span></div><div style="height:10px;border-radius:99px;background:var(--soft);margin-top:5px"><div style="height:100%;width:${v/tmax*100}%;border-radius:99px;background:var(--g700)"></div></div></div>`).join('')}</div></div>
  <div class="card" style="margin-top:14px"><h3>Calendario de temporadas<button class="btn sm" onclick="addNote()">+ Nota</button></h3><div class="rows">${S.notes.slice().sort((a,b)=>a.desde-b.desde).map(n=>`<div><span class="pill ${n.tipo==='buena'?'ok':n.tipo==='mala'?'bad':'warn'}">${n.tipo}</span><div class="grow"><b>${esc(n.texto)}</b><span>${fdate(n.desde)} → ${fdate(n.hasta)}</span></div></div>`).join('')}</div></div>`;
}
function monthDetail(mk){

  <div class="card kpi" style="background:var(--panel)"><div class="lbl">Gastos</div><div class="val num" style="font-size:22px">${clp(m.egresos)}</div></div>

}
function downloadCSV(rows,name){
  const csv='﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.href=url;a.download=name;document.body.appendChild(a);
  try{a.click()}finally{a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
}
function exportMonths(){
  const ps=S.products;
  const rows=[['Mes','Ventas $','N° ventas',...ps.map(p=>p.nombre+(p.unidad==='kg'?' (kg)':' (gam.)')),'Entradas bodega','Salidas','Bolsillo']];
  [...new Set(revenueEntries().map(s=>monthKey(s.fecha)))].sort().forEach(mk=>{const m=monthStats(mk);rows.push([monthName(mk),m.ventas,m.n,...ps.map(p=>String(m.byProd[p.id]?.qty||0).replace('.',',')),m.ingresos,m.egresos,m.bolsillo])});
  downloadCSV(rows,`cierres-de-mes-${today()}.csv`);
}
function addNote(){modal(`<h2>Nota de temporada</h2><div class="row"><div class="f"><label>Desde</label><input id="nd" class="in" type="date"></div><div class="f"><label>Hasta</label><input id="nh" class="in" type="date"></div></div><div class="f"><label>Tipo</label><select id="nt" class="in"><option value="buena">Buena</option><option value="mala">Mala</option><option value="evento">Evento / recordatorio</option></select></div><div class="f"><label>Texto</label><input id="nx" class="in"></div><div class="acts"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="const d=$('#nd').value,h=$('#nh').value||d;if(!d||!$('#nx').value)return toast('Fecha y texto obligatorios');S.notes.push({id:uid('n'),desde:new Date(d+'T12:00').getTime(),hasta:new Date(h+'T12:00').getTime(),tipo:$('#nt').value,texto:$('#nx').value});save();closeModal();render()">Guardar</button></div>`)}
function exportCSV(){
  const rows=[['N°','Documento','Fecha','Vendedor','Producto','Unidad','Cantidad','Precio','Subtotal','Estado','Medio de pago']];
  S.sales.forEach(s=>s.lineas.forEach(l=>rows.push([s.num,receiptKind(s),fdt(s.fecha),U(s.vendedor).nombre,lineName(l),l.unidad,String(l.qty).replace('.',','),l.precio,l.subtotal,s.estado,s.pagos.filter(p=>p.monto).map(p=>receiptPayment(p.medio)).join(' + ')])));
  downloadCSV(rows,`ventas-${today()}.csv`);
}

/* ---------- CRÉDITOS: saldo por cliente, abonos que entran a la caja ---------- */
function creditCard(){
  const t=creditTotal(),n=debtors().length;
  return `<button type="button" class="card credit-card" onclick="go('credits')"><span class="lbl">${ic('coin',18)} Créditos por cobrar</span><span class="val num">${clp(t)}</span><span class="sub">${n?`${n} cliente${n>1?'s':''} te debe${n>1?'n':''} · toca para ir a Créditos`:'Nadie te debe'}</span></button>`;
}
function debtorRows(){const d=debtors();return d.length?d.map(c=>`<div class="click" onclick="creditDetail('${c.id}')"><span class="avatar" style="width:36px;height:36px;font-size:13px">${esc(c.nombre[0])}</span><div class="grow"><b>${esc(c.nombre)}</b><span>${creditSales(c.id).length} compras a crédito</span></div><b class="num credit-owed">${clp(c.saldo)}</b><button type="button" class="btn sm pri" onclick="event.stopPropagation();abonoForm('${c.id}')">Pagar</button></div>`).join(''):'<div class="empty">Nadie te debe en este momento.</div>'}
function debtorsModal(){modal(`<h2>¿Quién me debe?</h2><p class="muted">Total por cobrar: <b>${clp(creditTotal())}</b>. Toca un nombre para ver su detalle.</p><div class="rows" style="margin-top:8px">${debtorRows()}</div><div class="acts"><button class="btn ghost" onclick="closeModal()">Cerrar</button><button class="btn pri" onclick="closeModal();go('credits')">Ir a Créditos</button></div>`)}
/* crédito en el punto de venta: checkbox + monto + cliente; un vendedor pide autorización al admin */
function creditBox(total,fiado,rest){
  const cs=liveClients().filter(c=>c.activo!==false).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
  const known=ui.clienteNombre?findClientByName(ui.clienteNombre):null;
  return `<label class="gamchk credit-check"><input type="checkbox" ${ui.credito?'checked':''} onchange="toggleCredit(this.checked,${total})"><span><b>Crédito</b>${isAdmin()?'':'<small>Requiere autorización de Luis</small>'}</span></label>
  ${ui.credito?`<div class="credit-fields">
    <div class="f"><label for="credit-amount">¿Cuánto paga ahora?</label><input id="credit-amount" class="in num" type="text" inputmode="numeric" autocomplete="off" value="${Number(ui.creditoPaga)||0}" onchange="ui.creditoPaga=parseInt(this.value.replace(/\D/g,''))||0;render()"><small class="muted">Total de la venta ${clp(total)} · ${fiado?`queda a crédito <b>${clp(fiado)}</b>`:'no queda nada a crédito'}${!rest&&fiado?' (todo a crédito)':''}</small>${(Number(ui.creditoPaga)||0)>=total&&total?'<small class="err">Si paga todo, no es crédito: desmarca Crédito.</small>':''}</div>
    <div class="f"><label for="credit-client">Nombre del cliente</label><input id="credit-client" class="in" list="credit-clients" maxlength="60" autocomplete="off" value="${esc(ui.clienteNombre||'')}" placeholder="Ej: Sergio" onchange="ui.clienteNombre=this.value.trim();render()"><datalist id="credit-clients">${cs.map(c=>`<option value="${esc(c.nombre)}"></option>`).join('')}</datalist>
    <small class="muted">${!ui.clienteNombre?'Escribe o elige un cliente.':known?(known.activo===false?`${esc(known.nombre)} está desactivado para crédito.`:`${esc(known.nombre)} debe hoy ${clp(creditBalance(known.id))}.`):'Cliente nuevo: se agrega al módulo de créditos.'}</small></div>
    ${isAdmin()?'':creditAuthStatus(total,fiado)}
  </div>`:''}`;
}
function creditAuthStatus(total,fiado){
  const r=creditReq(ui.creditReq),now_={user:me.id,nombre:ui.clienteNombre||'',monto:fiado,total};
  if(creditRequestMatches(r,now_))return `<p><span class="pill ok">Crédito autorizado por ${esc(U(r.resueltoPor).nombre)}</span></p>`;
  const same=r&&r.estado==='pendiente'&&r.monto===fiado&&r.total===total&&searchText(r.clienteNombre)===searchText(now_.nombre);
  if(same)return `<p><span class="pill warn">Esperando autorización de Luis</span> <button class="btn sm ghost" onclick="cancelCreditRequest()">Cancelar</button></p>`;
  const note=r?.estado==='rechazada'?'<span class="pill bad">Luis rechazó el crédito</span> ':r&&['aprobada','pendiente'].includes(r.estado)?'<span class="pill warn">La venta cambió: pide autorización de nuevo</span> ':'';
  return `<p>${note}<button class="btn sm pri" onclick="requestCredit()">Pedir autorización a Luis</button></p>`;
}
function toggleCredit(on,total){
  if(!on)cancelCreditRequest(true);
  ui.credito=on;if(on)ui.creditoPaga=0;render();
}
function requestCredit(){
  try{
    const items=checkoutItems(),total=items.reduce((n,i)=>n+itemTotal(i),0);
    if(!items.length)throw new Error('Agrega productos antes de pedir el crédito.');
    const plan=creditPlan(total);
    const r=workflowTransaction(()=>{const old=creditReq(ui.creditReq);if(old?.estado==='pendiente'){old.estado='cancelada';old.resueltoEn=now()}
      const r={id:uid('cq'),user:me.id,clienteNombre:plan.nombre,monto:plan.monto,total,detalle:items.map(i=>`${qtyFmt(i.qty,P(i.prod).unidad)} ${P(i.prod).nombre}`).join(', '),fecha:now(),estado:'pendiente',resueltoPor:'',resueltoEn:0,saleId:''};
      S.creditRequests.push(r);audit('Pide autorización de crédito',plan.nombre,'',clp(plan.monto)+' de '+clp(total));return r});
    ui.creditReq=r.id;render();toast('Solicitud enviada. Espera la respuesta de Luis.');
  }catch(e){toast(e.message)}
}
function cancelCreditRequest(silent){
  const r=creditReq(ui.creditReq);
  if(r?.estado==='pendiente'){try{workflowTransaction(()=>{r.estado='cancelada';r.resueltoEn=now()})}catch(e){if(!silent)toast(e.message)}}
  ui.creditReq='';if(!silent)render();
}
function resolveCreditRequest(id,ok){
  try{workflowAdmin();workflowTransaction(()=>{const r=creditReq(id);if(!r||r.estado!=='pendiente')throw new Error('Esta solicitud ya fue respondida.');
    r.estado=ok?'aprobada':'rechazada';r.resueltoPor=me.id;r.resueltoEn=now();audit(ok?'Autoriza crédito':'Rechaza crédito',r.clienteNombre+' · '+U(r.user).nombre,'',clp(r.monto))});
    render();toast(ok?'Crédito autorizado.':'Crédito rechazado.');
  }catch(e){toast(e.message)}
}
/* ---------- precio especial por una venta ---------- */
function priceLineStatus(c){
  if(c.p.envase)return '';
  const btn=label=>`<button type="button" class="btn sm ghost" onclick="priceForm(${c.i})">💲 ${label}</button>`;
  if(isAdmin())return `<div class="price-st">${c.precioAdmin?'<span class="pill warn">Precio especial</span>':''}${btn(c.precioAdmin?'Cambiar':'Cambiar precio')}</div>`;
  const r=priceReq(c.priceReq);
  if(r?.estado==='pendiente')return `<div class="price-st"><span class="pill warn">Esperando a Luis: ${clp(r.precio)}</span><button type="button" class="btn sm ghost" onclick="cancelPriceRequest(${c.i})">Cancelar</button></div>`;
  if(priceRequestMatches(r,c,me.id))return `<div class="price-st"><span class="pill ok">Precio autorizado por ${esc(U(r.resueltoPor).nombre)}</span></div>`;
  return `<div class="price-st">${r?.estado==='rechazada'?`<span class="pill bad">Luis rechazó ${clp(r.precio)}</span>`:''}${btn('Pedir otro precio')}</div>`;
}
function priceForm(i){
  const c=ui.cart[i],p=c&&P(c.prod);if(!p||p.envase)return;
  const u=p.unidad==='kg'?'kg':'gamela',cur=cartPrice(c);
  modal(`<h2>Cambiar precio</h2><p class="muted">${esc(p.nombre)} · ${qtyFmt(c.qty,p.unidad)}. Precio normal ${clp(p.precio)} por ${u}. Solo vale para esta venta.</p>
  <div class="f"><label for="pe-precio">Nuevo precio por ${u}</label><input id="pe-precio" class="in num" type="text" inputmode="numeric" autocomplete="off" autofocus value="${cur!==p.precio?cur:''}" oninput="const v=parseInt(this.value.replace(/\D/g,''))||0;$('#pe-total').textContent=v?'Total de la línea: '+clp(Math.round(${c.qty}*v))+' (normal ${clp(Math.round(c.qty*p.precio))})':''"><small class="muted" id="pe-total"></small></div>
  ${isAdmin()?'':'<p class="muted">Luis recibe el aviso y la venta queda en espera hasta que responda.</p>'}
  <div class="acts"><button class="btn ghost" onclick="closeModal()">Cancelar</button>${isAdmin()&&c.precioAdmin?`<button class="btn ghost" onclick="savePrice(${i},true)">Volver al precio normal</button>`:''}<button class="btn pri" onclick="savePrice(${i})">${isAdmin()?'Aplicar precio':'Pedir autorización a Luis'}</button></div>`);
}
function savePrice(i,reset){
  const c=ui.cart[i],p=c&&P(c.prod);if(!p)return;
  if(isAdmin()&&reset){delete c.precioAdmin;closeModal();render();return}
  const v=parseInt(String($('#pe-precio').value).replace(/\D/g,''))||0;
  if(!(v>0))return toast('Ingresa el nuevo precio.');
  if(v===p.precio)return toast('Es el mismo precio normal.');
  if(isAdmin()){c.precioAdmin=v;closeModal();render();toast('Precio especial aplicado solo a esta venta.');return}
  try{
    const r=workflowTransaction(()=>{const old=priceReq(c.priceReq);if(old?.estado==='pendiente'){old.estado='cancelada';old.resueltoEn=now()}
      const r={id:uid('pq'),user:me.id,prod:p.id,qty:c.qty,precioNormal:p.precio,precio:v,fecha:now(),estado:'pendiente',resueltoPor:'',resueltoEn:0,saleId:''};
      S.priceRequests.push(r);audit('Pide precio especial',p.nombre,clp(p.precio),clp(v)+' · '+qtyFmt(c.qty,p.unidad));return r});
    c.priceReq=r.id;closeModal();render();toast('Solicitud enviada. Espera la respuesta de Luis.');
  }catch(e){toast(e.message)}
}
function cancelPriceRequest(i,silent){
  const c=ui.cart[i],r=c&&priceReq(c.priceReq);
  if(r?.estado==='pendiente'){try{workflowTransaction(()=>{r.estado='cancelada';r.resueltoEn=now()})}catch(e){if(!silent)toast(e.message)}}
  if(c)delete c.priceReq;if(!silent)render();
}
function removeCartLine(i){cancelPriceRequest(i,true);ui.cart.splice(i,1);render()}
function resolvePriceRequest(id,ok){
  try{workflowAdmin();workflowTransaction(()=>{const r=priceReq(id);if(!r||r.estado!=='pendiente')throw new Error('Esta solicitud ya fue respondida.');
    r.estado=ok?'aprobada':'rechazada';r.resueltoPor=me.id;r.resueltoEn=now();audit(ok?'Autoriza precio especial':'Rechaza precio especial',P(r.prod).nombre+' · '+U(r.user).nombre,clp(r.precioNormal),clp(r.precio))});
    render();toast(ok?'Precio autorizado.':'Precio rechazado.');
  }catch(e){toast(e.message)}
}

/* la venta en curso (carrito, pago, crédito y solicitudes) se guarda por usuario para no perderla al recargar */
const POS_KEYS=['cart','pago','pagoEf','mixFirst','mixedSecond','documento','receptor','credito','creditoPaga','clienteNombre','creditReq','gamExtra','gamTrae'];
const POS_DEFAULT=()=>({cart:[],pago:'efectivo',pagoEf:0,mixFirst:'efectivo',mixedSecond:'transferencia',documento:'boleta',receptor:{},credito:false,creditoPaga:0,clienteNombre:'',creditReq:'',gamExtra:0,gamTrae:0});
const posKey=()=>'bodegaLV.pos.'+(me?.id||'');
function savePosDraft(){if(!me||isAccountant())return;try{localStorage.setItem(posKey(),JSON.stringify(Object.fromEntries(POS_KEYS.map(k=>[k,ui[k]]))))}catch(e){}}
function loadPosDraft(){
  Object.assign(ui,POS_DEFAULT());if(!me)return;
  try{const d=JSON.parse(localStorage.getItem(posKey())||'null');if(d&&typeof d==='object'){for(const k of POS_KEYS)if(k in d)ui[k]=d[k];
    ui.cart=(Array.isArray(ui.cart)?ui.cart:[]).filter(c=>P(c.prod)?.activo&&Number(c.qty)>0)}}catch(e){}
}
function creditRequestBanner(){
  const rs=pendingCreditRequests();if(!rs.length)return '';
  return `<section class="card request-alert" role="region" aria-label="Solicitudes de crédito"><h3>${ic('bell',18)} ${rs.length===1?'Un vendedor pide':'Vendedores piden'} autorización de crédito</h3><div class="rows">${rs.map(r=>{const c=findClientByName(r.clienteNombre),debe=c?creditBalance(c.id):0;return `<div style="flex-wrap:wrap;gap:8px 12px"><div class="grow"><b>${esc(U(r.user).nombre)} quiere fiar ${clp(r.monto)} a ${esc(r.clienteNombre)}</b><span>${c?`Hoy debe ${clp(debe)} · quedaría en ${clp(debe+r.monto)}`:'Cliente nuevo'} · venta de ${clp(r.total)}: ${esc(r.detalle)} · ${ftime(r.fecha)}</span></div><button class="btn sm bad" onclick="resolveCreditRequest('${r.id}',false)">Rechazar</button><button class="btn sm pri" onclick="resolveCreditRequest('${r.id}',true)">Autorizar</button></div>`}).join('')}</div></section>`;
}
function creditPlan(total){
  if(!ui.credito)return null;
  const paga=Number(ui.creditoPaga)||0,monto=total-paga,nombre=String(ui.clienteNombre||'').trim();
  if(!Number.isSafeInteger(paga)||paga<0)throw new Error('Indica cuánto paga ahora.');
  if(monto<=0)throw new Error('Si paga todo, no es crédito: desmarca Crédito.');
  if(!nombre)throw new Error('Escribe el nombre del cliente que pide el crédito.');
  const known=findClientByName(nombre);
  if(known?.activo===false)throw new Error(`${known.nombre} está desactivado para crédito.`);
  return {monto,nombre:known?known.nombre:nombre};
}
function viewCredits(){
  const all=liveClients().map(c=>({...c,saldo:creditBalance(c.id)})),aldia=all.filter(c=>c.saldo<=0).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
  return head('Créditos','Lo que te deben tus clientes. Los pagos de deuda entran a la caja de quien los recibe.',isAdmin()?`<button class="btn pri" onclick="editClient()">${ic('plus',18)}Nuevo cliente</button>`:'')+
  `<div class="grid g3 stack"><div class="card kpi hero"><div class="lbl">Total por cobrar</div><div class="val num">${clp(creditTotal())}</div><div class="sub">${debtors().length} clientes con deuda</div></div>

  <div class="card" style="margin-top:14px"><h3>Al día</h3><div class="rows">${aldia.map(c=>`<div class="click" onclick="creditDetail('${c.id}')"><div class="grow"><b>${esc(c.nombre)}</b><span>${c.activo===false?'Inactivo':'Sin deuda'}</span></div><span class="pill ok">Al día</span>${isAdmin()?`<button class="btn sm ghost" onclick="event.stopPropagation();deleteClient('${c.id}')" aria-label="Borrar a ${esc(c.nombre)}">🗑️ Borrar</button>`:''}</div>`).join('')||'<div class="muted">Todos los clientes tienen saldo pendiente.</div>'}</div></div>`;
}
function creditDetail(id){
  const c=CL(id),saldo=creditBalance(id);

    ...creditPayments(id).map(a=>({f:a.fecha,t:`Pago en ${receiptPayment(a.medio).toLowerCase()}${a.ref?' · '+a.ref:''}`,abono:a.monto,u:a.user}))].sort((a,b)=>b.f-a.f);
  modal(`<p class="muted" style="margin:0">Cuenta de crédito</p><h2>${esc(c.nombre)}</h2>${c.rut||c.fono?`<p class="muted">${[c.rut,c.fono].filter(Boolean).map(esc).join(' · ')}</p>`:''}
  <div class="total"><span>Debe</span><span class="num" style="color:${saldo>0?'var(--bad)':'var(--g700)'}">${clp(Math.max(0,saldo))}</span></div>
  <div class="scroll"><table class="tbl"><thead><tr><th>Fecha</th><th>Detalle</th><th class="right">Crédito</th><th class="right">Pagó</th></tr></thead><tbody>
  ${mov.map(m=>`<tr><td>${fdt(m.f)}</td><td>${esc(m.t)}<br><small class="muted">${esc(U(m.u).nombre)}</small></td><td class="right num">${m.cargo?clp(m.cargo):''}</td><td class="right num" style="color:var(--g700)">${m.abono?clp(m.abono):''}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Sin movimientos</td></tr>'}
  </tbody></table></div>
  <div class="acts">${isAdmin()&&saldo<=0?`<button class="btn ghost" style="color:var(--bad)" onclick="deleteClient('${id}')">🗑️ Borrar cliente</button>`:''}${isAdmin()?`<button class="btn ghost" onclick="editClient('${id}')">Editar cliente</button>`:''}<button class="btn ghost" onclick="closeModal()">Cerrar</button>${saldo>0?`<button class="btn pri" onclick="abonoForm('${id}')">Pagar deuda</button>`:''}</div>`,true);

function confirmDeleteClient(id){

function abonoForm(id){
  if(!isAdmin())return toast('Solo Luis registra pagos de crédito.');

  <div class="seg" role="group" aria-label="Cuánto paga"><button type="button" class="on" id="ab-todo" onclick="abonoMode(true,${saldo})">Paga todo</button><button type="button" id="ab-parte" onclick="abonoMode(false,${saldo})">Paga una parte</button></div>

function abonoMode(all,saldo){const i=$('#ab-monto');$('#ab-todo').classList.toggle('on',all);$('#ab-parte').classList.toggle('on',!all);i.value=all?saldo:'';abonoLeft(saldo);if(!all)i.focus()}
function abonoLeft(saldo){const m=Number(String($('#ab-monto').value).replace(/\D/g,''))||0;$('#ab-left').textContent=m>saldo?`Supera la deuda (${clp(saldo)}).`:m===saldo?'Queda saldada la deuda.':m?`Queda debiendo ${clp(saldo-m)}.`:'Ingresa cuánto paga.'}
function saveAbono(id){
  try{workflowUser();if(!isAdmin())throw new Error('Solo Luis registra pagos de crédito.');const monto=Number(String($('#ab-monto').value).replace(/\D/g,'')),medio=$('#ab-medio').value,ref='';
    workflowTransaction(()=>{const saldo=creditBalance(id);
      if(!Number.isSafeInteger(monto)||monto<=0)throw new Error('Ingresa el monto del abono.');
      if(monto>saldo)throw new Error(`El abono supera la deuda (${clp(saldo)}).`);
      if(!['efectivo','transferencia','tarjeta','cheque'].includes(medio))throw new Error('Elige cómo paga.');
      S.creditPayments.push({id:uid('ab'),cliente:id,monto,medio,ref,fecha:now(),user:me.id,cierre:''});audit('Abono de crédito',CL(id).nombre,clp(saldo),clp(saldo-monto)+' · '+receiptPayment(medio))});
    render();creditDetail(id);toast(creditBalance(id)<=0?`Deuda de ${CL(id).nombre} saldada.`:`Pago registrado. Queda debiendo ${clp(creditBalance(id))}.`);
  }catch(e){toast(e.message)}
}

function saveUser(id){

load();ensureWorkflowState();
try{const id=sessionStorage.getItem('bodegaLV.me');if(id){const u=S.users.find(x=>x.id===id&&x.activo);if(u){me=u;view=homeView(u);const v=JSON.parse(sessionStorage.getItem('bodegaLV.view')||'null');if(v&&menu().some(m=>m.id===v.view)){view=v.view;if(v.salesTab)ui.salesTab=v.salesTab;if(v.recTab)ui.recTab=v.recTab}loadPosDraft()}}}catch(e){}
// otra pestaña (otro vendedor) cambia datos → refresca stock y precios
window.addEventListener('storage',e=>{if(e.key===KEY){load();ensureWorkflowState();
if(me)me=S.users.find(u=>u.id===me.id);if(!me||!me.activo){me=null}if(!document.querySelector('.ov'))render()}});
render();
</script>
</body>
