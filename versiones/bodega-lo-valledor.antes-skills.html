function drawGasto(){
  const fijo=gf.tipo==='fijo',cats=fijo?FIX_CATS:VAR_CATS,gam=!fijo&&gf.cat==='Compra de gamelas';
  if(!cats.includes(gf.cat))gf.cat=cats[0];
  modal(`<h2>Agregar gasto</h2><p class="muted">${fijo?'Se repetirá todos los meses desde este mes, hasta que lo desactives.':'Se registra solo en el mes de la fecha.'}</p>
  <div class="f"><div class="seg"><button class="${!fijo?'on':''}" onclick="gf.tipo='variable';drawGasto()">Variable</button><button class="${fijo?'on':''}" onclick="gf.tipo='fijo';drawGasto()">Fijo mensual</button></div></div>
  <div class="row"><div class="f"><label>Categoría</label><select id="g_c" class="in" onchange="gf.cat=this.value;drawGasto()">${cats.map(c=>`<option ${gf.cat===c?'selected':''}>${c}</option>`).join('')}</select></div>
  ${fijo?'':`<div class="f"><label>Fecha</label><input id="g_f" class="in" type="date" value="${gf.fecha||today()}" max="${today()}"></div>`}</div>
  ${gam?`<div class="f"><label>Cantidad de gamelas compradas</label><input id="g_q" class="in num" type="number" inputmode="numeric" value="${gf.qty||''}" oninput="gf.qty=this.value"><small class="muted">Se suman al stock de gamelas para vender.</small></div>`:''}
  <div class="row"><div class="f"><label>Monto total</label><input id="g_m" class="in num" type="number" inputmode="numeric" value="${gf.monto||''}" oninput="gf.monto=this.value"></div>
  <div class="f"><label>Descripción</label><input id="g_d" class="in" value="${esc(gf.desc||'')}" oninput="gf.desc=this.value" placeholder="${fijo?'Ej: sueldo Gonzalo':'Opcional'}"></div></div>
  <div class="acts"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="saveGasto()">Guardar</button></div>`);
}
function saveGasto(){
  const m=parseInt($('#g_m').value),cat=$('#g_c').value,desc=$('#g_d').value.trim();
  if(!(m>0)){toast('Ingresa el monto');return}
  if(gf.tipo==='fijo'){S.fixed.push({id:uid('f'),cat,desc,monto:m,desde:monthKey(now()),hasta:''});audit('Crea gasto fijo',desc||cat,'',clp(m)+'/mes')}
  else{
    const d=$('#g_f').value||today();const fecha=d===today()?now():new Date(d+'T12:00').getTime();
    if(cat==='Compra de gamelas'){const q=parseInt($('#g_q').value);if(!(q>0)){toast('Ingresa cuántas gamelas compraste');return}buyGamelas(q,m,fecha,me.id,desc)}
    else S.expenses.push({id:uid('e'),fecha,cat,monto:m,desc});
    audit('Registra gasto',cat,'',clp(m));
  }
  gm=gf.tipo==='fijo'?monthKey(now()):monthKey(new Date(($('#g_f')?.value||today())+'T12:00').getTime());
  save();closeModal();render();toast('Gasto registrado');
}
function editFixed(id){
  const f=S.fixed.find(x=>x.id===id),mk=monthKey(now());
  modal(`<h2>Gasto fijo</h2><p class="muted">Desde ${monthName(f.desde)}${f.hasta?' hasta '+monthName(f.hasta):' · se repite cada mes'}. Un cambio de monto rige desde este mes; los anteriores no cambian.</p>
  <div class="row"><div class="f"><label>Categoría</label><select id="x_c" class="in">${FIX_CATS.map(c=>`<option ${f.cat===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="f"><label>Monto mensual</label><input id="x_m" class="in num" type="number" value="${f.monto}"></div></div>
  <div class="f"><label>Descripción</label><input id="x_d" class="in" value="${esc(f.desc)}"></div>
  <div class="acts"><button class="btn bad" onclick="delFixed('${id}')">Eliminar</button>${f.hasta?'':`<button class="btn ghost" onclick="endFixed('${id}')">Dejar de repetir</button>`}<button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="updFixed('${id}')">Guardar</button></div>`);
}
function updFixed(id){
  const f=S.fixed.find(x=>x.id===id),m=parseInt($('#x_m').value),d=$('#x_d').value.trim(),c=$('#x_c').value,mk=monthKey(now());
  if(!(m>0)){toast('Monto inválido');return}
  if(c!==f.cat||d!==f.desc)audit('Edita gasto fijo',f.desc||f.cat,f.cat+' · '+f.desc,c+' · '+d);
  f.cat=c;f.desc=d;
  if(m!==f.monto){audit('Cambia monto gasto fijo',d||c,clp(f.monto),clp(m));
    if(f.desde>=mk||f.hasta)f.monto=m;else{f.hasta=prevMonth(mk);S.fixed.push({id:uid('f'),cat:c,desc:d,monto:m,desde:mk,hasta:''})}}
  save();closeModal();render();toast('Gasto fijo actualizado');
}
function delFixed(id){
  const f=S.fixed.find(x=>x.id===id);
  modal(`<h2>¿Eliminar gasto fijo?</h2><p class="muted"><b>${esc(f.desc||f.cat)}</b> (${clp(f.monto)}/mes) se quitará de <b>todos</b> los meses, también de los ya cerrados. Si solo quieres que no siga desde ahora, usa “Dejar de repetir”.</p>

}
function endFixed(id){const f=S.fixed.find(x=>x.id===id),mk=monthKey(now());if(f.desde===mk)S.fixed=S.fixed.filter(x=>x!==f);else f.hasta=prevMonth(mk);audit('Termina gasto fijo',f.desc||f.cat,clp(f.monto)+'/mes','sin repetir desde '+monthName(mk));save();closeModal();render();toast('Ya no se repetirá desde este mes')}
function editVar(id){
  const e=S.expenses.find(x=>x.id===id),gam=!!e.cantidad,d=dayKey(e.fecha);
  modal(`<h2>Gasto variable</h2><p class="muted">${gam?'Compra de gamelas: cambiar la cantidad ajusta el stock de gamelas.':'Registrado el '+fdate(e.fecha)+'.'}</p>
  <div class="row">${gam?'':`<div class="f"><label>Categoría</label><select id="v_c" class="in">${VAR_CATS.filter(c=>c!=='Compra de gamelas').map(c=>`<option ${e.cat===c?'selected':''}>${c}</option>`).join('')}</select></div>`}

  <div class="acts"><button class="btn bad" onclick="delVar('${id}')">Eliminar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="updVar('${id}')">Guardar</button></div>`);
}
function updVar(id){
  const e=S.expenses.find(x=>x.id===id),m=parseInt($('#v_m').value),d=$('#v_f').value,desc=$('#v_d').value.trim();
  if(!(m>0)){toast('Monto inválido');return}
  const antes=`${e.cat} · ${fdate(e.fecha)} · ${clp(e.monto)}${e.cantidad?' · '+e.cantidad+' gam.':''}`;
  if(e.cantidad){
    const q=parseInt($('#v_q').value);if(!(q>0)){toast('Cantidad inválida');return}
    const lot=S.lots.find(l=>l.id===e.lot),delta=q-e.cantidad;
    if(delta<0&&lotStock(lot.id)+delta<0){toast(`No se puede bajar a ${q}: ya se vendieron ${e.cantidad-lotStock(lot.id)} de esas gamelas`);return}
    if(delta)S.moves.push({id:uid('m'),lot:lot.id,prod:lot.prod,tipo:'ajuste',qty:delta,user:me.id,fecha:now(),motivo:'Corrección compra de gamelas',ref:e.id});
    e.cantidad=q;lot.costo=Math.round(m/q);
  }else e.cat=$('#v_c').value;
  if(d&&d!==dayKey(e.fecha))e.fecha=new Date(d+'T12:00').getTime();
  e.monto=m;e.desc=desc;
  audit('Edita gasto',e.cat,antes,`${e.cat} · ${fdate(e.fecha)} · ${clp(e.monto)}${e.cantidad?' · '+e.cantidad+' gam.':''}`);
  gm=monthKey(e.fecha);save();closeModal();render();toast('Gasto actualizado');
}
function delVar(id){
  const e=S.expenses.find(x=>x.id===id);
  if(e.cantidad){const st=lotStock(e.lot);if(st<e.cantidad){toast(`No se puede eliminar: ya se vendieron ${e.cantidad-st} de esas gamelas. Edita la cantidad en su lugar.`);return}}
  modal(`<h2>¿Eliminar gasto?</h2><p class="muted"><b>${esc(e.cat)}</b> del ${fdate(e.fecha)} por ${clp(e.monto)}${e.cantidad?`. También se descuentan ${e.cantidad} gamelas del stock`:''}. Queda registrado en el historial de movimientos.</p>
  <div class="acts"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn bad" onclick="doDelVar('${id}')">Eliminar</button></div>`);
}
function doDelVar(id){
  const e=S.expenses.find(x=>x.id===id);
  if(e.cantidad){const lot=S.lots.find(l=>l.id===e.lot);S.moves.push({id:uid('m'),lot:lot.id,prod:lot.prod,tipo:'anulación',qty:-e.cantidad,user:me.id,fecha:now(),motivo:'Compra de gamelas eliminada',ref:e.id})}
  S.expenses=S.expenses.filter(x=>x.id!==id);
  audit('Elimina gasto',e.cat,`${fdate(e.fecha)} · ${clp(e.monto)}${e.desc?' · '+e.desc:''}`,'eliminado');
  save();closeModal();render();toast('Gasto eliminado');
}

/* ---------- BALANCE: cuánto queda en el bolsillo ---------- */
function monthStats(mk){
  const lot=Object.fromEntries(S.lots.map(l=>[l.id,l]));
  const r={mk,ventas:0,n:0,propias:0,costoVendido:0,consig:0,comision:0,gamVend:0,gamVendN:0,byProd:{},merma:{}};
  S.sales.filter(s=>vig(s)&&monthKey(s.fecha)===mk).forEach(s=>{
    r.ventas+=s.total;r.n++;
    s.lineas.forEach(ln=>{
      const b=r.byProd[ln.prod]||(r.byProd[ln.prod]={qty:0,monto:0});b.qty+=ln.qty;b.monto+=ln.subtotal;
      if(P(ln.prod).envase){r.gamVend+=ln.subtotal;r.gamVendN+=ln.qty;return}
      ln.allocs.forEach(a=>{const l=lot[a.lot],m=Math.round(a.qty*ln.precio);
        if(l&&l.modalidad==='consignación'){r.consig+=m;r.comision+=Math.round(m*(PR(l.productor).comision??S.cfg.comision)/100)}
        else{r.propias+=m;r.costoVendido+=Math.round(a.qty*(l?.costo||0))}});
    });
  });
  S.moves.filter(m=>m.tipo==='merma'&&monthKey(m.fecha)===mk).forEach(m=>r.merma[m.prod]=(r.merma[m.prod]||0)-m.qty);
  r.compras=S.receptions.filter(x=>!x.anulada&&x.modalidad==='compra'&&monthKey(x.fecha)===mk).reduce((a,x)=>a+x.lineas.reduce((b,l)=>b+l.qty*l.costo,0),0);
  r.fijos=fixedFor(mk);r.vars=varFor(mk);
  r.gamComp=r.vars.filter(e=>e.cantidad).reduce((a,e)=>a+e.monto,0);r.gamCompN=r.vars.filter(e=>e.cantidad).reduce((a,e)=>a+e.cantidad,0);
  r.tFijos=r.fijos.reduce((a,f)=>a+f.monto,0);r.tVars=r.vars.reduce((a,e)=>a+e.monto,0);
  r.ingresos=r.propias+r.comision+r.gamVend;
  r.egresos=r.compras+r.tFijos+r.tVars;
  r.bolsillo=r.ingresos-r.egresos;
  return r;
}
let bm='';

  const row=(t,sub,v,neg)=>`<div><div class="grow"><b>${t}</b>${sub?`<span>${sub}</span>`:''}</div><b class="num" style="color:${neg?'var(--bad)':'var(--g700)'}">${neg?'− ':'+ '}${clp(v)}</b></div>`;
  const byCat={};b.vars.filter(e=>!e.cantidad).forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+e.monto);
  const hist=[...Array(6)].map((_,i)=>{let k=monthKey(now());for(let j=0;j<i;j++)k=prevMonth(k);return monthStats(k)}).filter(x=>x.n||x.egresos);
  return head('Balance',`Lo que entra y sale de la bodega en ${monthName(bm)}.`,monthPick(bm,'bm'))+

   <div class="card kpi"><div class="lbl">Salidas</div><div class="val num" style="font-size:30px;color:var(--bad)">${clp(b.egresos)}</div><div class="sub" style="color:var(--muted)">compras + gastos</div></div></div>
  <div class="grid g2 stack" style="margin-top:14px">
   <div class="card"><h3>Entradas</h3><div class="rows">
     ${row('Venta de mercadería propia','compra directa (palta, otros…)',b.propias)}
     ${row(`Comisión de productores`,`${S.cfg.comision}% de ${clp(b.consig)} vendidos en consignación`,b.comision)}
     ${row('Venta de gamelas',`${b.gamVendN} gamelas`,b.gamVend)}
   </div><p class="muted" style="font-size:12px;margin:10px 0 0">De lo vendido en consignación, ${clp(b.consig-b.comision)} son de los productores y se pagan en las liquidaciones; no cuentan como entrada de la bodega.</p></div>
   <div class="card"><h3>Salidas</h3><div class="rows">
     ${row('Compra de mercadería','recepciones en compra directa',b.compras,1)}
     ${b.fijos.map(f=>row(esc(f.desc||f.cat),esc(f.cat)+' · fijo',f.monto,1)).join('')}
     ${b.gamComp?row('Compra de gamelas',`${b.gamCompN} gamelas`,b.gamComp,1):''}
     ${Object.entries(byCat).map(([c,v])=>row(esc(c),'variable',v,1)).join('')}
   </div></div>
  </div>
  <div class="grid g2 stack" style="margin-top:14px">
   <div class="card"><h3>Gamelas del mes</h3><div class="rows">
     ${row('Vendidas',`${b.gamVendN} × ${clp(gamProd().precio)}`,b.gamVend)}
     ${row('Compradas',`${b.gamCompN} gamelas`,b.gamComp,1)}
     <div><div class="grow"><b>Resultado gamelas</b><span>Stock actual: ${prodStock(gamId())} gamelas</span></div><b class="num">${clp(b.gamVend-b.gamComp)}</b></div>
   </div></div>
   <div class="card"><h3>Últimos meses</h3><div class="scroll"><table class="tbl"><thead><tr><th>Mes</th><th class="right">Entradas</th><th class="right">Salidas</th><th class="right">Bolsillo</th></tr></thead><tbody>
     ${hist.map(h=>`<tr class="click" onclick="bm='${h.mk}';render()"><td><b>${monthName(h.mk)}</b></td><td class="right num">${clp(h.ingresos)}</td><td class="right num">${clp(h.egresos)}</td><td class="right num" style="color:${h.bolsillo<0?'var(--bad)':'var(--g700)'}"><b>${clp(h.bolsillo)}</b></td></tr>`).join('')}
   </tbody></table></div></div>
  </div>`;
}

/* ---------- REPORTES: cierres de mes ---------- */
let rp='mes';
function unitTotals(st){
  const u={};Object.entries(st.byProd).forEach(([pid,b])=>{const p=P(pid);const k=p.envase?'Gamelas (envase)':p.familia;const x=u[k]||(u[k]={qty:0,unidad:p.unidad});x.qty+=b.qty});
  return u;
}
function viewRep(){
  const months=[...new Set(S.sales.map(s=>monthKey(s.fecha)))].sort().reverse();
  const ms=months.map(monthStats);
  const fmtK={dia:t=>dayKey(t),semana:t=>{const d=new Date(t);const o=new Date(d.getFullYear(),0,1);return d.getFullYear()+'-S'+pad2(Math.ceil(((d-o)/DAY+o.getDay()+1)/7))},mes:t=>dayKey(t).slice(0,7),año:t=>dayKey(t).slice(0,4)}[rp];
  const g={};S.sales.filter(vig).forEach(s=>{const k=fmtK(s.fecha);(g[k]||(g[k]={v:0,n:0,gam:0,kg:0})).v+=s.total;g[k].n++;s.lineas.forEach(l=>{if(P(l.prod).envase)return;l.unidad==='kg'?g[k].kg+=l.qty:g[k].gam+=l.qty})});
  const keys=Object.keys(g).sort().reverse();
  const top={};S.sales.filter(vig).forEach(s=>s.lineas.forEach(l=>{top[l.prod]=(top[l.prod]||0)+l.subtotal}));
  const topL=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,6);const tmax=topL[0]?.[1]||1;
  return head('Reportes','Cierre de cada mes con todas sus cantidades, para comparar más adelante.',`<button class="btn" onclick="exportCSV()">Exportar ventas</button><button class="btn" onclick="exportMonths()">Exportar cierres</button>`)+
  `<div class="card"><h3>Cierres de mes</h3><div class="scroll"><table class="tbl"><thead><tr><th>Mes</th><th class="right">Ventas</th><th class="right">N° ventas</th><th class="right">Tomate</th><th class="right">Palta</th><th class="right">Otros</th><th class="right">Gamelas (envase)</th><th class="right">Bolsillo</th></tr></thead><tbody>
  ${ms.map(m=>{const u=unitTotals(m);const c=k=>u[k]?qtyFmt(u[k].qty,u[k].unidad):'—';return `<tr class="click" onclick="monthDetail('${m.mk}')"><td><b>${monthName(m.mk)}</b>${m.mk===monthKey(now())?' <span class="pill warn">en curso</span>':''}</td><td class="right num"><b>${clp(m.ventas)}</b></td><td class="right num">${m.n}</td><td class="right num">${c('Tomate')}</td><td class="right num">${c('Palta')}</td><td class="right num">${c('Otros')}</td><td class="right num">${c('Gamelas (envase)')}</td><td class="right num" style="color:${m.bolsillo<0?'var(--bad)':'var(--g700)'}"><b>${clp(m.bolsillo)}</b></td></tr>`}).join('')||'<tr><td colspan="8" class="empty">Aún no hay ventas</td></tr>'}
  </tbody></table></div><p class="muted" style="font-size:12px;margin:8px 0 0">Toca un mes para ver el detalle por producto.</p></div>
  <div class="grid g3" style="margin-top:14px"><div class="card span2"><h3>Ventas por periodo<span class="seg" style="max-width:340px;flex:1">${['dia','semana','mes','año'].map(p=>`<button class="${rp===p?'on':''}" onclick="rp='${p}';render()">${p==='dia'?'Día':p[0].toUpperCase()+p.slice(1)}</button>`).join('')}</span></h3>
    <div class="scroll"><table class="tbl"><thead><tr><th>Periodo</th><th class="right">Ventas</th><th class="right">N°</th><th class="right">Gamelas</th><th class="right">Kg</th></tr></thead><tbody>${keys.map(k=>`<tr><td><b>${k}</b></td><td class="right num">${clp(g[k].v)}</td><td class="right num">${g[k].n}</td><td class="right num">${g[k].gam}</td><td class="right num">${kg(g[k].kg)}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="card"><h3>Más vendidos</h3>${topL.map(([pid,v])=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px"><b>${esc(P(pid).nombre)}</b><span class="num">${clp(v)}</span></div><div style="height:10px;border-radius:99px;background:var(--soft);margin-top:5px"><div style="height:100%;width:${v/tmax*100}%;border-radius:99px;background:var(--g700)"></div></div></div>`).join('')}</div></div>
  <div class="card" style="margin-top:14px"><h3>Calendario de temporadas<button class="btn sm" onclick="addNote()">+ Nota</button></h3><div class="rows">${S.notes.slice().sort((a,b)=>a.desde-b.desde).map(n=>`<div><span class="pill ${n.tipo==='buena'?'ok':n.tipo==='mala'?'bad':'warn'}">${n.tipo}</span><div class="grow"><b>${esc(n.texto)}</b><span>${fdate(n.desde)} → ${fdate(n.hasta)}</span></div></div>`).join('')}</div></div>`;
}
function monthDetail(mk){
  const m=monthStats(mk);
  const rows=S.products.filter(p=>m.byProd[p.id]||m.merma[p.id]).map(p=>{const b=m.byProd[p.id]||{qty:0,monto:0};return `<tr><td>${esc(p.nombre)}</td><td class="right num">${qtyFmt(b.qty,p.unidad)}</td><td class="right num">${m.merma[p.id]?qtyFmt(m.merma[p.id],p.unidad):'—'}</td><td class="right num">${clp(b.monto)}</td></tr>`}).join('');
  modal(`<div class="printable doc"><div class="hd">${LOGO(44)}<div><b style="font-size:16px">Cierre de ${monthName(mk)}</b><br><span class="muted">${esc(S.cfg.nombre)}</span></div></div>
  <div class="grid g3" style="margin-bottom:12px"><div class="card kpi" style="background:var(--panel)"><div class="lbl">Ventas</div><div class="val num" style="font-size:22px">${clp(m.ventas)}</div><div class="sub">${m.n} ventas</div></div>
  <div class="card kpi" style="background:var(--panel)"><div class="lbl">Gastos</div><div class="val num" style="font-size:22px">${clp(m.egresos)}</div></div>
  <div class="card kpi hero"><div class="lbl">Bolsillo</div><div class="val num" style="font-size:22px">${clp(m.bolsillo)}</div></div></div>
  <div class="scroll"><table class="tbl"><thead><tr><th>Producto</th><th class="right">Vendido</th><th class="right">Merma</th><th class="right">Monto</th></tr></thead><tbody>${rows}</tbody></table></div></div>
  <div class="acts noprint"><button class="btn ghost" onclick="window.print()">${ic('print',17)}PDF</button><button class="btn" onclick="closeModal();bm='${mk}';go('bal')">Ver balance</button><button class="btn pri" onclick="closeModal()">Listo</button></div>`,true);
}
function downloadCSV(rows,name){
  const csv='﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click();
}
function exportMonths(){
  const ps=S.products;
  const rows=[['Mes','Ventas $','N° ventas',...ps.map(p=>p.nombre+(p.unidad==='kg'?' (kg)':' (gam.)')),'Entradas bodega','Salidas','Bolsillo']];
  [...new Set(S.sales.map(s=>monthKey(s.fecha)))].sort().forEach(mk=>{const m=monthStats(mk);rows.push([monthName(mk),m.ventas,m.n,...ps.map(p=>String(m.byProd[p.id]?.qty||0).replace('.',',')),m.ingresos,m.egresos,m.bolsillo])});
  downloadCSV(rows,`cierres-de-mes-${today()}.csv`);
}
function addNote(){modal(`<h2>Nota de temporada</h2><div class="row"><div class="f"><label>Desde</label><input id="nd" class="in" type="date"></div><div class="f"><label>Hasta</label><input id="nh" class="in" type="date"></div></div><div class="f"><label>Tipo</label><select id="nt" class="in"><option value="buena">Buena</option><option value="mala">Mala</option><option value="evento">Evento / recordatorio</option></select></div><div class="f"><label>Texto</label><input id="nx" class="in"></div><div class="acts"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="const d=$('#nd').value,h=$('#nh').value||d;if(!d||!$('#nx').value)return toast('Fecha y texto obligatorios');S.notes.push({id:uid('n'),desde:new Date(d+'T12:00').getTime(),hasta:new Date(h+'T12:00').getTime(),tipo:$('#nt').value,texto:$('#nx').value});save();closeModal();render()">Guardar</button></div>`)}
function exportCSV(){
  const rows=[['N°','Fecha','Vendedor','Producto','Unidad','Cantidad','Precio','Subtotal','Estado']];
  S.sales.forEach(s=>s.lineas.forEach(l=>rows.push([s.num,fdt(s.fecha),U(s.vendedor).nombre,P(l.prod).nombre,l.unidad,String(l.qty).replace('.',','),l.precio,l.subtotal,s.estado])));
  downloadCSV(rows,`ventas-${today()}.csv`);
}

/* ---------- 7. USUARIOS Y AJUSTES ---------- */
function viewUsers(){
  const k=today();
  return head('Usuarios y ajustes','Crea vendedores, restablece contraseñas y configura la bodega.',`<button class="btn pri" onclick="editUser()">${ic('plus',18)}Nuevo usuario</button>`)+
  `<div class="grid g3 stack"><div class="card span2"><h3>Usuarios</h3><div class="scroll"><table class="tbl"><thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Turno</th><th class="right">Ventas hoy</th><th class="right">Ventas mes</th><th>Estado</th><th></th></tr></thead><tbody>
  ${S.users.map(u=>{const s=S.sales.filter(x=>vig(x)&&x.vendedor===u.id);return `<tr><td><b>${esc(u.nombre)}</b></td><td class="muted">${esc(u.usuario)}</td><td>${u.rol==='admin'?'Administrador':'Vendedor'}</td><td>${esc(u.turno)}</td><td class="right num">${clp(s.filter(x=>dayKey(x.fecha)===k).reduce((a,x)=>a+x.total,0))}</td><td class="right num">${clp(s.filter(x=>dayKey(x.fecha).slice(0,7)===k.slice(0,7)).reduce((a,x)=>a+x.total,0))}</td><td>${u.activo?'<span class="pill ok">Activo</span>':'<span class="pill mute">Inactivo</span>'}</td><td><button class="btn sm ghost" onclick="editUser('${u.id}')">Editar</button></td></tr>`}).join('')}
  </tbody></table></div></div>
  <div class="card"><h3>Ajustes de la bodega</h3>
    <div class="f"><label>Nombre comercial</label><input id="s_n" class="in" value="${esc(S.cfg.nombre)}"></div>
    <div class="f"><label>RUT</label><input id="s_r" class="in" value="${esc(S.cfg.rut)}"></div>
    <div class="row"><div class="f"><label>Precio de venta de la gamela</label><input id="s_g" class="in num" type="number" value="${gamProd().precio}"></div><div class="f"><label>Comisión por defecto %</label><input id="s_c" class="in num" type="number" value="${S.cfg.comision}"></div></div>
    <div class="row"><div class="f"><label>Inicio de jornada (hora)</label><input id="s_h" class="in num" type="number" min="0" max="23" value="${S.cfg.inicioJornada}"></div></div>
    <button class="btn pri big" onclick="saveCfg()">Guardar ajustes</button>
    <button class="btn bad big" style="margin-top:10px" onclick="resetDemo()">Reiniciar datos de prueba</button>
  </div></div>`;
}
function saveCfg(){const o=JSON.stringify(S.cfg);const vg=+$('#s_g').value||0,gp=gamProd();if(vg&&vg!==gp.precio){S.prices.push({prod:gp.id,precio:vg,desde:now(),user:me.id});audit('Cambio de precio',gp.nombre,clp(gp.precio),clp(vg));gp.precio=vg}Object.assign(S.cfg,{nombre:$('#s_n').value.trim()||S.cfg.nombre,rut:$('#s_r').value.trim(),comision:+$('#s_c').value||0,inicioJornada:Math.min(23,Math.max(0,+$('#s_h').value||0))});audit('Cambia ajustes','Configuración',o,JSON.stringify(S.cfg));save();render();toast('Ajustes guardados')}
function resetDemo(){modal(`<h2>¿Reiniciar datos?</h2><p class="muted">Se borra todo lo registrado en este navegador y se cargan los datos de ejemplo.</p><div class="acts"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn bad" onclick="try{localStorage.removeItem(KEY)}catch(e){};seed();closeModal();me=S.users[0];render()">Reiniciar</button></div>`)}
function editUser(id){
  const u=id?U(id):{nombre:'',usuario:'',rol:'vendedor',turno:'mañana',activo:true};
  modal(`<h2>${id?'Editar':'Nuevo'} usuario</h2><div class="f"><label>Nombre</label><input id="u_n" class="in" value="${esc(u.nombre)}"></div>
  <div class="row"><div class="f"><label>Rol</label><select id="u_r" class="in"><option value="vendedor" ${u.rol==='vendedor'?'selected':''}>Vendedor</option><option value="admin" ${u.rol==='admin'?'selected':''}>Administrador</option></select></div><div class="f"><label>Turno</label><select id="u_t" class="in">${['mañana','noche','-'].map(t=>`<option ${u.turno===t?'selected':''}>${t}</option>`).join('')}</select></div></div>
  <div class="row"><div class="f"><label>Usuario</label><input id="u_u" class="in" autocapitalize="none" value="${esc(u.usuario||'')}"></div>
  <div class="f"><label>${id?'Nueva contraseña (vacío = no cambiar)':'Contraseña'}</label><input id="u_p" class="in" type="password" autocomplete="new-password"></div></div>
  ${id&&id!==me.id?`<label class="f" style="flex-direction:row;align-items:center"><input id="u_a" type="checkbox" ${u.activo?'checked':''}> Activo (desactivar cierra su sesión)</label>`:''}
  <div class="acts"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="saveUser('${id||''}')">Guardar</button></div>`);
}
function saveUser(id){
  const n=$('#u_n').value.trim(),usr=$('#u_u').value.trim().toLowerCase(),pin=$('#u_p').value;
  if(!n||!usr){toast('Nombre y usuario son obligatorios');return}if(pin&&pin.length<4){toast('La contraseña debe tener al menos 4 caracteres');return}if(!id&&!pin){toast('Ingresa una contraseña');return}
  if(S.users.some(u=>u.usuario===usr&&u.id!==id)){toast('Ese usuario ya existe');return}
  const d={nombre:n,usuario:usr,rol:$('#u_r').value,turno:$('#u_t').value};
  if(id){const u=U(id);if(pin)d.clave=pin;if($('#u_a'))d.activo=$('#u_a').checked;audit('Edita usuario',u.nombre,u.rol+'/'+(u.activo?'activo':'inactivo'),d.rol+'/'+((d.activo??u.activo)?'activo':'inactivo')+(pin?' · contraseña restablecida':''));Object.assign(u,d)}
  else{S.users.push({id:uid('u'),...d,clave:pin,activo:true});audit('Crea usuario',n,'',d.rol)}
  save();closeModal();render();toast('Usuario guardado');
}

/* ---------- tema ---------- */
const THEMES=[['dark','moon','Oscuro'],['mint','half','Mixto'],['light','sun','Claro']];
function applyTheme(t){document.documentElement.dataset.theme=t;const m=document.querySelector('meta[name=theme-color]');if(m)m.content={dark:'#030a05',mint:'#0d3d22',light:'#f5f8f6'}[t]}
function setTheme(t){applyTheme(t);try{localStorage.setItem('bodegaLV.theme',t)}catch(e){}render()}
const themePicker=()=>`<div class="themes">${THEMES.map(([t,i,n])=>`<button type="button" title="Tema ${n}" class="${document.documentElement.dataset.theme===t?'on':''}" onclick="setTheme('${t}')">${ic(i,17)}</button>`).join('')}</div>`;
(()=>{let t=null;try{t=localStorage.getItem('bodegaLV.theme')}catch(e){}applyTheme(t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))})();

/* ---------- arranque ---------- */
load();
try{const id=sessionStorage.getItem('bodegaLV.me');if(id){const u=S.users.find(x=>x.id===id&&x.activo);if(u){me=u;view=u.rol==='admin'?'dash':'pos'}}}catch(e){}
// otra pestaña (otro vendedor) cambia datos → refresca stock y precios
window.addEventListener('storage',e=>{if(e.key===KEY){load();if(me)me=S.users.find(u=>u.id===me.id);if(!me||!me.activo){me=null}if(!document.querySelector('.ov'))render()}});
render();
</script>
</body>
</html>
