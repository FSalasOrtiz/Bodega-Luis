<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b34">
<title>Bodega Lo Valledor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1ee; --panel:#f6f8f6; --card:#fff; --ink:#14201a; --muted:#7a857f; --line:#e4e9e5;
  --g900:#0a3d22; --g800:#0b5a30; --g700:#0b6b34; --g500:#2e9b55; --g300:#8fd19e; --lime:#8ccf00; --g100:#e5f4e8;
  --warn:#d98b00; --warn-bg:#fff4dc; --bad:#c8392b; --bad-bg:#fde8e5; --ok-bg:#e5f4e8;
  --soft:#eef1ee; --soft2:#f2f4f3; --hover:#fafcfa; --field:#fff; --mark:#e3f5c4; --glass:rgba(255,255,255,.55); --glass-card:rgba(255,255,255,.72); --glass-bd:rgba(255,255,255,.7); --blur:saturate(160%) blur(18px);
  --r:22px; --r-sm:14px; --sh:0 1px 2px rgba(10,40,20,.04);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;letter-spacing:-.02em}
.app{display:grid;grid-template-columns:240px 1fr;gap:14px;max-width:1440px;margin:0 auto;padding:14px;min-height:100vh}
/* sidebar */
.side{background:var(--panel);border-radius:var(--r);padding:22px 0;display:flex;flex-direction:column;position:sticky;top:14px;height:calc(100vh - 28px)}
.brand{display:flex;align-items:center;gap:10px;padding:0 22px 22px;font-weight:800;font-size:17px;line-height:1.1}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.navlbl{font-size:11px;color:var(--muted);padding:12px 26px 6px;text-transform:uppercase;letter-spacing:.06em}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 26px;color:var(--muted);text-decoration:none;font-weight:500;position:relative;cursor:pointer}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink);font-weight:700}
.nav a.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--g700)}
.nav a.on svg{color:var(--g700)}
.nav svg{width:19px;height:19px;flex:none}
.side .promo{margin:auto 14px 0;border-radius:18px;padding:18px;color:#fff;background:radial-gradient(120% 90% at 100% 100%,#1f8b47 0,transparent 60%),linear-gradient(160deg,#0d2a19,#07170e);font-size:13px}
.side .promo b{font-size:16px;display:block;margin-bottom:4px}
/* main */
.main{background:var(--panel);border-radius:var(--r);padding:18px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.search{flex:1;max-width:340px;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:10px 16px;color:var(--muted)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--card);border:0;display:grid;place-items:center;cursor:pointer;flex:none;position:relative}
.iconbtn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.me{display:flex;align-items:center;gap:10px;margin-left:auto}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--g500),var(--g800));flex:none}
.me b{display:block;font-size:14px}.me span{font-size:12px;color:var(--muted)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:30px;font-weight:700}
.head p{margin:4px 0 0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:1.5px solid var(--g800);background:var(--card);color:var(--g800);font-weight:600;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--g800);color:#fff}
.btn.pri:hover{background:var(--g900)}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:34px;padding:0 14px;font-size:13px}
.btn.big{min-height:56px;font-size:16px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* grid & cards */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.span2{grid-column:span 2}.span3{grid-column:span 3}
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--sh);min-width:0}
.card h3{font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.kpi .lbl{font-weight:600;display:flex;justify-content:space-between;align-items:center}
.kpi .val{font-size:40px;font-weight:700;letter-spacing:-.03em;margin:14px 0 8px;line-height:1}
.kpi .sub{font-size:12px;color:var(--g700);display:flex;align-items:center;gap:6px}
.kpi .arrow{width:30px;height:30px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;opacity:.8}
.kpi.hero{color:#fff;background:linear-gradient(150deg,#1d7c45,#0b4a27)}
.kpi.hero .sub{color:#c9f0d3}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--g700);border-color:#cfe8d5}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:#f5e0ad}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:#f5c9c2}
.pill.mute{background:var(--soft2);color:var(--muted)}
.muted{color:var(--muted)}
.right{text-align:right}
.num{font-variant-numeric:tabular-nums}
/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--hover)}
.scroll{overflow-x:auto;margin:0 -6px;padding:0 6px}
/* bars chart (donezo striped) */
.bars{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:24px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;position:relative}
.bar i{display:block;width:100%;max-width:46px;border-radius:999px;min-height:46px;background:repeating-linear-gradient(135deg,#fff 0 4px,#9aa59f 4px 6px);border:1.5px solid #9aa59f}
.bar i.on{background:var(--g700);border-color:var(--g700)}
.bar i.on2{background:var(--g500);border-color:var(--g500)}
.bar i.today{background:var(--g900);border-color:var(--g900)}
.bar span{font-size:12px;color:var(--muted)}
.bar em{position:absolute;font-style:normal;font-size:10.5px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 5px;white-space:nowrap}
.gauge{display:flex;flex-direction:column;align-items:center}
.gauge .pct{font-size:40px;font-weight:700;margin-top:-62px}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted);margin-top:14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.rows>div{display:flex;align-items:center;gap:12px;padding:9px 0}
.rows>div+div{border-top:1px solid var(--line)}
.rows .grow{flex:1;min-width:0}
.rows .grow b{display:block;font-size:13.5px}
.rows .grow span{font-size:12px;color:var(--muted)}
.ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:700;font-size:13px}
.ico.t{background:#fde7e3;color:#c8392b}.ico.p{background:var(--g100);color:var(--g700)}.ico.o{background:#fff1d6;color:#c97a00}
.dark{color:#fff;background:radial-gradient(90% 80% at 80% 100%,#1f8b47 0,transparent 65%),linear-gradient(160deg,#0d2a19,#07170e)}
.dark .muted{color:#a9c3b2}
/* price strip */
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip b{display:block;font-size:14px}
.chip.on{background:var(--g800);color:#fff;border-color:var(--g800)}
.chip.flash{animation:flash 1.6s ease 2}
@keyframes flash{50%{background:#fff3c4;border-color:var(--warn)}}
/* POS */
.pos{display:grid;grid-template-columns:1fr 360px;gap:14px;align-items:start}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.prod{background:var(--card);border:1.5px solid transparent;border-radius:18px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:120px}
.prod:hover{border-color:var(--g300)}
.prod .nm{font-weight:700;font-size:14.5px;line-height:1.2}
.prod .pr{font-size:18px;font-weight:800;color:var(--g800);margin-top:auto}
.prod .st{font-size:12px;color:var(--muted)}
.prod.out{opacity:.5}
.cart{position:sticky;top:14px}
.line{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.line .grow{flex:1;min-width:0}
.line small{color:var(--muted);display:block}
.x{border:0;background:var(--soft2);width:30px;height:30px;border-radius:50%;cursor:pointer;flex:none}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:24px;margin:12px 0}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:10px 6px;cursor:pointer;font-weight:600;color:var(--muted);min-height:40px}
.seg button.on{background:var(--card);color:var(--g800);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* forms */
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.f label{font-size:12.5px;font-weight:600;color:var(--muted)}
.in{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;background:var(--field);outline:0}
.in:focus{border-color:var(--g500)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
textarea.in{padding:10px 14px;min-height:70px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:52px;height:52px;border-radius:16px;border:0;background:var(--g100);color:var(--g800);font-size:24px;font-weight:700;cursor:pointer;flex:none}
.stepper input{text-align:center;font-size:22px;font-weight:700;min-height:52px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.bigbtn{border:0;border-radius:var(--r);padding:26px 20px;text-align:left;cursor:pointer;background:var(--card);display:flex;flex-direction:column;gap:6px;min-height:130px}
.bigbtn b{font-size:20px}
.bigbtn.on{background:linear-gradient(150deg,#1d7c45,#0b4a27);color:#fff}
.bigbtn.on span{color:#c9f0d3}
.bigbtn span{color:var(--muted);font-size:13px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(8,25,15,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);border-radius:24px;width:100%;max-width:480px;max-height:calc(100vh - 32px);overflow:auto;padding:22px}
.modal.wide{max-width:720px}
.modal h2{font-size:20px;margin-bottom:4px}
.modal .acts{display:flex;gap:10px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--g900);color:#fff;padding:12px 20px;border-radius:999px;z-index:60;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px);text-align:center}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border-radius:18px;box-shadow:0 12px 32px rgba(10,40,20,.16);z-index:20;padding:6px;max-height:360px;overflow:auto}
.sug button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px;border-radius:12px;text-align:left;cursor:pointer;min-height:52px}
.sug button:hover{background:var(--g100)}
.sug .grow{flex:1;min-width:0}.sug small{display:block;color:var(--muted);font-size:12px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.gamchk{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:6px;cursor:pointer}
.gamchk:has(input:checked){border-color:var(--g700);background:var(--g100)}
.gamchk input{width:22px;height:22px;accent-color:var(--g700);flex:none}
.gamchk small{display:block;color:var(--muted);font-size:12px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.bnav{display:none}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login .box{background:var(--card);border-radius:28px;padding:30px 24px;width:100%;max-width:400px;text-align:center}
.users{display:flex;flex-direction:column;gap:8px;margin:18px 0}
.users button{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:10px 14px;cursor:pointer;text-align:left;min-height:56px}
.users button.on{border-color:var(--g700);background:var(--g100)}
.pin{display:flex;justify-content:center;gap:12px;margin:14px 0}
.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--g700)}
.pin i.f{background:var(--g700)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto}
.pad button{height:58px;border-radius:18px;border:0;background:#f1f4f2;font-size:22px;font-weight:700;cursor:pointer}
.pad button:active{background:var(--g100)}
.err{color:var(--bad);font-size:13px;min-height:18px}
.print-only{display:none}
.doc{font-size:13px}.doc .hd{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--g700);padding-bottom:10px;margin-bottom:12px}

/* ===== efecto vidrio + tema oscuro ===== */
body{background:
  radial-gradient(40vw 40vw at 8% 10%,rgba(46,155,85,.28),transparent 70%),
  radial-gradient(35vw 35vw at 92% 18%,rgba(140,207,0,.22),transparent 70%),
  radial-gradient(45vw 45vw at 70% 95%,rgba(11,107,52,.22),transparent 70%),
  var(--bg);background-attachment:fixed}
.side,.main{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-bd)}
.card:not(.hero):not(.dark),.prod,.bigbtn:not(.on),.search,.iconbtn,.chip:not(.on),.login .box,.sug{background:var(--glass-card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-bd)}
.kpi.hero,.bigbtn.on{box-shadow:0 10px 30px rgba(11,90,48,.28),inset 0 1px 0 rgba(255,255,255,.18)}
.modal{background:var(--glass-card);backdrop-filter:saturate(160%) blur(28px);-webkit-backdrop-filter:saturate(160%) blur(28px);border:1px solid var(--glass-bd);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.ov{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.bnav{background:var(--glass-card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.btn:not(.pri){background:var(--glass-card)}
.prod{transition:transform .15s,box-shadow .15s}.prod:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(10,40,20,.1)}
@media (max-width:760px){.main{background:transparent;border:0;backdrop-filter:none;-webkit-backdrop-filter:none}}
@media print{body{background:#fff}.modal{background:#fff;backdrop-filter:none}}
:root[data-theme="dark"]{
  --bg:#07120c; --panel:#0e1c14; --card:#12241a; --ink:#e6efe9; --muted:#8fa398; --line:rgba(255,255,255,.09);
  --g800:#2e9b55; --g700:#4fbf72; --g500:#5fcf82; --g900:#1d7c45; --g100:rgba(79,191,114,.14); --g300:#2e9b55;
  --warn:#f0b54a; --warn-bg:rgba(240,181,74,.13); --bad:#ff7a6b; --bad-bg:rgba(255,122,107,.13); --ok-bg:rgba(79,191,114,.13);
  --soft:rgba(255,255,255,.06); --soft2:rgba(255,255,255,.08); --hover:rgba(255,255,255,.04); --field:rgba(0,0,0,.25); --mark:rgba(140,207,0,.3);
  --glass:rgba(16,32,23,.55); --glass-card:rgba(22,42,30,.6); --glass-bd:rgba(255,255,255,.08);
  color-scheme:dark;
}
:root[data-theme="dark"] body{background:
  radial-gradient(40vw 40vw at 8% 10%,rgba(46,155,85,.25),transparent 70%),
  radial-gradient(35vw 35vw at 92% 18%,rgba(140,207,0,.12),transparent 70%),
  radial-gradient(45vw 45vw at 70% 95%,rgba(11,107,52,.3),transparent 70%),
  var(--bg);background-attachment:fixed}
:root[data-theme="dark"] .btn.pri{background:#1d7c45;border-color:#2e9b55}
:root[data-theme="dark"] .btn.pri:hover{background:#2e9b55}
:root[data-theme="dark"] .pill.ok{border-color:rgba(79,191,114,.25)}
:root[data-theme="dark"] .pill.warn{border-color:rgba(240,181,74,.25)}
:root[data-theme="dark"] .pill.bad{border-color:rgba(255,122,107,.25)}
:root[data-theme="dark"] .ico.t{background:rgba(255,122,107,.15);color:#ff8f82}
:root[data-theme="dark"] .ico.o{background:rgba(240,181,74,.15);color:#f0b54a}
:root[data-theme="dark"] .seg button.on{box-shadow:none;background:rgba(255,255,255,.1)}
:root[data-theme="dark"] .x{color:var(--ink)}
:root[data-theme="dark"] .tbl tr.click:hover td{background:var(--hover)}

/* ===== tema oscuro: verde neón ===== */
:root[data-theme="dark"]{--g800:#22b04b;--g700:#3fdc6a;--g500:#5ff08a;--g900:#178a3a;--lime:#9cff3c;--glass:rgba(6,22,12,.72);--glass-card:rgba(14,40,22,.62);--glass-bd:rgba(80,230,120,.16)}
:root[data-theme="dark"] body{background:
  radial-gradient(50vw 40vw at 0% 0%,rgba(40,200,90,.35),transparent 65%),
  radial-gradient(40vw 40vw at 100% 100%,rgba(40,200,90,.28),transparent 65%),
  #030a05;background-attachment:fixed}
:root[data-theme="dark"] .side,:root[data-theme="dark"] .main{border:1px solid rgba(80,230,120,.35);box-shadow:0 0 0 1px rgba(80,230,120,.08),0 0 40px rgba(50,220,100,.22),inset 0 0 60px rgba(50,220,100,.05)}
:root[data-theme="dark"] .card:not(.hero){box-shadow:inset 0 1px 0 rgba(120,255,160,.08),0 6px 24px rgba(0,0,0,.35)}
:root[data-theme="dark"] .kpi.hero,:root[data-theme="dark"] .bigbtn.on{background:linear-gradient(150deg,#1fa748,#0a4a1f);box-shadow:0 0 30px rgba(60,230,110,.35),inset 0 1px 0 rgba(255,255,255,.2)}
:root[data-theme="dark"] .nav a.on::before{box-shadow:0 0 12px var(--g700)}
:root[data-theme="dark"] .btn.pri{background:linear-gradient(180deg,#2bc457,#159a3c);border-color:#3fdc6a;box-shadow:0 0 18px rgba(60,230,110,.35)}
:root[data-theme="dark"] .btn.sm.pri{box-shadow:0 0 12px rgba(60,230,110,.3)}
:root[data-theme="dark"] .num b,:root[data-theme="dark"] .prod .pr{text-shadow:0 0 14px rgba(60,230,110,.25)}

/* ===== tema mixto: menta con verde profundo ===== */
:root[data-theme="mint"]{--bg:#cfe8d6;--panel:#e6f4ea;--line:#d5e8da;--soft:#e4f1e7;--soft2:#e9f4ec;--hover:#f1f9f3;
  --glass:rgba(240,250,243,.55);--glass-card:rgba(255,255,255,.82);--glass-bd:rgba(255,255,255,.9)}
:root[data-theme="mint"] body{background:
  radial-gradient(50vw 40vw at 10% 0%,rgba(255,255,255,.7),transparent 65%),
  radial-gradient(45vw 45vw at 90% 100%,rgba(46,155,85,.22),transparent 65%),
  linear-gradient(160deg,#dcefe1,#bcdcc5);background-attachment:fixed}
:root[data-theme="mint"] .side{background:linear-gradient(180deg,#0d3d22,#082a17);border-color:rgba(255,255,255,.08);box-shadow:0 12px 40px rgba(8,42,23,.3)}
:root[data-theme="mint"] .side .nav a{color:#9fc3ad}
:root[data-theme="mint"] .side .nav a:hover,:root[data-theme="mint"] .side .nav a.on{color:#fff}
:root[data-theme="mint"] .side .nav a.on{background:rgba(140,207,0,.12)}
:root[data-theme="mint"] .side .nav a.on::before{background:var(--lime)}
:root[data-theme="mint"] .side .nav a.on svg{color:var(--lime)}
:root[data-theme="mint"] .side .navlbl{color:#6f9a80}
:root[data-theme="mint"] .side .promo{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
:root[data-theme="mint"] .kpi.hero,:root[data-theme="mint"] .bigbtn.on{background:radial-gradient(90% 90% at 100% 100%,#1f8b47,transparent 60%),linear-gradient(160deg,#0f3d22,#082a17);box-shadow:0 12px 30px rgba(8,42,23,.35)}
:root[data-theme="mint"] .card:not(.hero){box-shadow:0 6px 24px rgba(20,80,40,.08)}
@media (max-width:760px){:root[data-theme="mint"] .bnav{background:linear-gradient(180deg,#0d3d22,#082a17)}:root[data-theme="mint"] .bnav a{color:#9fc3ad}:root[data-theme="mint"] .bnav a.on{color:var(--lime)}}

/* ===== tema claro: blanco limpio ===== */
:root[data-theme="light"]{--bg:#f3f7f4;--glass:rgba(255,255,255,.6);--glass-card:rgba(255,255,255,.9)}
:root[data-theme="light"] body{background:
  radial-gradient(40vw 40vw at 0% 0%,rgba(46,155,85,.12),transparent 70%),
  radial-gradient(40vw 40vw at 100% 100%,rgba(140,207,0,.1),transparent 70%),#f5f8f6;background-attachment:fixed}
:root[data-theme="light"] .card:not(.hero),:root[data-theme="light"] .side,:root[data-theme="light"] .main{box-shadow:0 4px 20px rgba(20,60,35,.06)}

/* selector de tema */
.themes{display:flex;gap:2px;background:var(--glass-card);border:1px solid var(--glass-bd);border-radius:999px;padding:3px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.themes button{width:36px;height:36px;border:0;border-radius:50%;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.themes button.on{background:var(--g800);color:#fff}
@media print{
  body *{visibility:hidden}
  .printable,.printable *{visibility:visible}
  .printable{position:absolute;inset:0;padding:20px}
  .noprint{display:none!important}
}
@media (max-width:1100px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:1fr 1fr}
  .span3{grid-column:span 2}
  .pos{grid-template-columns:1fr}
  .cart{position:static}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr;padding:0;gap:0}
  .side{display:none}
  .main{border-radius:0;padding:14px 16px 96px;background:var(--bg)}
  .search{display:none}
  .head h1{font-size:24px}
  .g4,.g3,.g2{grid-template-columns:1fr 1fr}
  .span2,.span3{grid-column:1/-1}
  .g2.stack,.g3.stack{grid-template-columns:1fr}
  .kpi .val{font-size:30px}
  .card{padding:16px;border-radius:18px}
  .prods{grid-template-columns:1fr 1fr}
  .big2{grid-template-columns:1fr 1fr}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40;justify-content:space-around}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);padding:6px 2px;cursor:pointer;text-align:center;min-height:48px}
  .bnav a.on{color:var(--g800);font-weight:700}
  .bnav svg{width:22px;height:22px}
  .modal{border-radius:24px 24px 0 0;max-height:92vh;align-self:flex-end}
  .ov{padding:0}
  .hide-m{display:none}
}

<body>
<div id="root"></div>
<script>
/* ---------- iconos ---------- */
const I = {
  dash:'<path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/>',
  pos:'<path d="M6 6h15l-2 8H8L6 3H3"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/>',
  rec:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
  inv:'<path d="M4 6h16M4 12h16M4 18h10"/>',
  sales:'<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  moves:'<path d="M4 7h13l-3-3M20 17H7l3 3"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5 6.5-5s5.7 1.5 6.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.3 0 4 1.2 4.5 4"/>',
  prod:'<path d="M12 21c-4-3-8-6.5-8-11a5 5 0 0 1 8-4 5 5 0 0 1 8 4c0 4.5-4 8-8 11z"/>',
  rep:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  out:'<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>',
  bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  arrow:'<path d="M7 17L17 7M9 7h8v8"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  wa:'<path d="M4 20l1.3-4A8 8 0 1 1 8 18.7z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  half:'<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>',
  exp:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/><path d="M6 6V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/>',
  bal:'<path d="M12 3v18M5 21h14M6 7h12M6 7l-3 7a3 3 0 0 0 6 0zM18 7l-3 7a3 3 0 0 0 6 0z"/>',
  print:'<path d="M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7z"/>',
};
const ic=(n,s=19)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const LOGO=(s=38)=>`<svg width="${s}" height="${s*.8}" viewBox="0 0 100 80"><path d="M50 40C40 22 30 10 14 6c4 18 16 30 36 34z" fill="#1f8b3e"/><path d="M52 40c6-14 16-22 32-24-6 14-16 22-32 24z" fill="#7fc31c"/><path d="M8 78V58a13 13 0 0 1 26 0v20M34 58a13 13 0 0 1 26 0v20" stroke="#0b6b34" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M92 54a14 14 0 1 0 0 16" stroke="#8ccf00" stroke-width="10" fill="none" stroke-linecap="round"/></svg>`;

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clp=n=>'$'+Math.round(n||0).toLocaleString('es-CL');
const kg=n=>(Math.round((n||0)*100)/100).toLocaleString('es-CL',{maximumFractionDigits:2});
const qtyFmt=(q,u)=>u==='kg'?kg(q)+' kg':Math.round(q).toLocaleString('es-CL')+' gam.';
const pad2=n=>String(n).padStart(2,'0');
const fdate=t=>{const d=new Date(t);return `${pad2(d.getDate())}-${pad2(d.getMonth()+1)}-${d.getFullYear()}`};
const ftime=t=>{const d=new Date(t);return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`};
const fdt=t=>fdate(t)+' '+ftime(t);
const uid=p=>p+Math.random().toString(36).slice(2,9);
const now=()=>Date.now();
const DAY=864e5;
// jornada comercial: el "día" parte a la hora configurada
const dayKey=t=>{const d=new Date(t-(S.cfg.inicioJornada||0)*36e5);return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`};
const today=()=>dayKey(now());

/* ---------- datos ---------- */
const KEY='bodegaLV.v3';
let S;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);return}}catch(e){}seed()}
function seed(){
  const t=now();
  S={cfg:{nombre:'Bodega Lo Valledor',rut:'76.000.000-0',comision:10,inicioJornada:6},
    users:[
      {id:'u1',nombre:'Luis',usuario:'luis',rol:'admin',turno:'-',clave:'1234',activo:true},
      {id:'u2',nombre:'Vendedor noche',usuario:'noche',rol:'vendedor',turno:'noche',clave:'1111',activo:true},
      {id:'u3',nombre:'Vendedor mañana',usuario:'manana',rol:'vendedor',turno:'mañana',clave:'2222',activo:true}],
    products:[],producers:[],receptions:[],lots:[],moves:[],sales:[],closures:[],liqs:[],prices:[],audit:[],expenses:[],fixed:[],notes:[]};
  const addP=(sku,nombre,fam,cal,unidad,precio,peso,gam,extra)=>S.products.push({id:uid('p'),sku,nombre,familia:fam,calibre:cal,unidad,precio,pesoCaja:peso||0,usaGamela:gam,activo:true,...extra});
  addP('TOM-C9','Tomate calibre 9','Tomate','9','gamela',20000,0,true);
  addP('TOM-C8','Tomate calibre 8','Tomate','8','gamela',18000,0,true);
  addP('TOM-C75','Tomate calibre 7½','Tomate','7½','gamela',16000,0,true);
  addP('TOM-C7','Tomate calibre 7','Tomate','7','gamela',14500,0,true);
  addP('TOM-C65','Tomate calibre 6½','Tomate','6½','gamela',12500,0,true);
  addP('TOM-C6','Tomate calibre 6','Tomate','6','gamela',11000,0,true);
  addP('TOM-DES','Tomate descarte','Tomate','desc.','gamela',6000,0,true);
  addP('TOM-RAM','Tomate en rama','Tomate','rama','gamela',17000,0,true);
  addP('TOM-PER','Tomate pera (larguito)','Tomate','pera','gamela',15000,0,true);
  addP('PAL-SUP','Palta súper','Palta','súper','kg',1600,15,false);
  addP('PAL-EXT','Palta extra','Palta','extra','kg',2100,15,false);
  addP('OTR-MAN','Mango','Otros','—','kg',2500,10,false);
  // la gamela vacía es un producto más: se compra (gasto) y se vende (checkbox en el punto de venta)
  addP('GAMELA','Gamela (envase)','Envases','—','gamela',1000,0,false,{envase:true});
  S.producers.push({id:'pr1',nombre:'Agrícola San Pedro',rut:'12.345.678-9',fono:'+56911112222',tipo:'productor',comision:10},
                   {id:'pr2',nombre:'Hnos. Riquelme',rut:'9.876.543-2',fono:'+56933334444',tipo:'productor',comision:10},
                   {id:'pr3',nombre:'Distribuidora Valle Sur',rut:'77.111.222-3',fono:'+56955556666',tipo:'proveedor',comision:0});
  // datos de demostración: ~2 meses de operación
  const sku=s=>S.products.find(p=>p.sku===s);
  const mkRec=(ts,prod,mod,lines,user)=>{
    const r={id:uid('r'),fecha:ts,productor:prod,modalidad:mod,pallets:Math.ceil(lines.reduce((a,l)=>a+l[1],0)/45),foto:'',user,anulada:false,lineas:[]};
    lines.forEach(([s,q,c])=>{const p=sku(s);const lot={id:uid('l'),rec:r.id,prod:p.id,qty:q,costo:c||0,fecha:ts,productor:prod,modalidad:mod};S.lots.push(lot);r.lineas.push({prod:p.id,qty:q,costo:c||0,lot:lot.id});S.moves.push({id:uid('m'),lot:lot.id,prod:p.id,tipo:'recepción',qty:q,user,fecha:ts,motivo:'',ref:r.id})});
    S.receptions.push(r);
  };
  const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  const vend=['u1','u2','u3'];
  const D=60;
  // los fijos parten el primer mes completo de los datos de ejemplo
  const m0=(()=>{const [y,m]=monthKey(t-D*DAY).split('-').map(Number);return m===12?`${y+1}-01`:`${y}-${pad2(m+1)}`})();
  S.fixed.push({id:uid('f'),cat:'Arriendo',desc:'Arriendo bodega',monto:850000,desde:m0,hasta:''},
               {id:uid('f'),cat:'Sueldos',desc:'Vendedor noche',monto:650000,desde:m0,hasta:''},
               {id:uid('f'),cat:'Sueldos',desc:'Vendedor mañana',monto:650000,desde:m0,hasta:''},
               {id:uid('f'),cat:'Luz y agua',desc:'Cuentas básicas',monto:95000,desde:m0,hasta:''});
  buyGamelas(800,560000,t-D*DAY-DAY,'u1','Stock inicial de gamelas');
  for(let d=D;d>=0;d--){
    const base=t-d*DAY;
    if(d%3===0)mkRec(base-8*36e5,d%6?'pr1':'pr2','consignación',[['TOM-C9',rnd(50,80)],['TOM-C8',rnd(40,60)],['TOM-C75',rnd(30,50)],['TOM-C7',rnd(25,40)],['TOM-C65',rnd(15,30)],['TOM-C6',rnd(15,30)],['TOM-DES',rnd(8,15)],['TOM-RAM',rnd(8,15)],['TOM-PER',rnd(8,15)]],d%2?'u2':'u3');
    if(d%7===0)mkRec(base-9*36e5,'pr3','compra',[['PAL-SUP',rnd(300,450),1100],['PAL-EXT',rnd(150,250),1500],['OTR-MAN',rnd(80,150),1700]],'u1');
    if(d===25)buyGamelas(400,300000,base-10*36e5,'u1','Reposición');
    if(d%10===4)S.expenses.push({id:uid('e'),fecha:base,cat:'Flete',monto:rnd(4,9)*10000,desc:'Flete mercadería'});
    const n=d===0?8:rnd(14,22);
    const times=[...Array(n)].map(()=>base-rnd(60,420)*6e4).sort((x,y)=>x-y);
    for(const ts of times){
      const pool=S.products.filter(p=>!p.envase&&prodStock(p.id,ts)>20);
      if(!pool.length)continue;
      const p=pool[rnd(0,pool.length-1)];
      const q=p.unidad==='kg'?p.pesoCaja*rnd(1,4):rnd(3,15);
      const items=[{prod:p.id,qty:q}];
      if(p.usaGamela&&Math.random()<.3){const g=rnd(1,Math.min(q,4));if(prodStock(gamId(),ts)>=g)items.push({prod:gamId(),qty:g})}
      try{makeSale({vendedor:vend[rnd(0,2)],items,pago:Math.random()<.6?'efectivo':'transferencia',fecha:ts,silent:true})}catch(e){}
    }
    if(d%4===1){const l=S.lots.filter(l=>!P(l.prod).envase&&lotStock(l.id,base)>8).pop();if(l)S.moves.push({id:uid('m'),lot:l.id,prod:l.prod,tipo:'merma',qty:-rnd(2,6),user:'u1',fecha:base,motivo:'podrido',ref:''})}
  }
  S.notes.push({id:uid('n'),desde:t+20*DAY,hasta:t+40*DAY,tipo:'buena',texto:'Temporada alta de tomate (fiestas)'},{id:uid('n'),desde:t+70*DAY,hasta:t+90*DAY,tipo:'mala',texto:'Febrero: baja demanda, vacaciones'});
  save();
}
const monthKey=t=>dayKey(t).slice(0,7);
const gamProd=()=>S.products.find(p=>p.envase);
const gamId=()=>gamProd().id;
// compra de gamelas: suma stock de envases y queda como gasto variable del mes
function buyGamelas(qty,monto,fecha,user,desc){
  const p=gamProd();
  const lot={id:uid('l'),rec:'',prod:p.id,qty,costo:Math.round(monto/qty),fecha,productor:'',modalidad:'compra'};
  S.lots.push(lot);
  S.moves.push({id:uid('m'),lot:lot.id,prod:p.id,tipo:'compra gamelas',qty,user,fecha,motivo:desc||'',ref:''});
  S.expenses.push({id:uid('e'),fecha,cat:'Compra de gamelas',monto,desc:desc||'',cantidad:qty,lot:lot.id});
}

/* ---------- stock por lotes (libro de movimientos) ---------- */
const P=id=>S.products.find(p=>p.id===id);
const U=id=>S.users.find(u=>u.id===id)||{nombre:'—'};
const PR=id=>S.producers.find(p=>p.id===id)||{nombre:'—'};
const lotStock=(id,until=Infinity)=>S.moves.reduce((a,m)=>m.lot===id&&m.fecha<=until?a+m.qty:a,0);
const prodStock=(id,until=Infinity)=>S.moves.reduce((a,m)=>m.prod===id&&m.fecha<=until?a+m.qty:a,0);
const prodLots=id=>S.lots.filter(l=>l.prod===id).sort((a,b)=>a.fecha-b.fecha);
// primero en entrar, primero en salir
function fifo(prodId,qty,until=Infinity){
  const out=[];let rest=qty;
  for(const l of prodLots(prodId)){
    if(rest<=1e-9)break;
    const s=lotStock(l.id,until);if(s<=1e-9)continue;
    const take=Math.min(s,rest);out.push({lot:l.id,qty:take});rest-=take;
  }
  return rest>1e-9?null:out;
}
const round2=n=>Math.round(n*100)/100;
function lineTotal(p,qty){return Math.round(qty*p.precio)}

function makeSale({vendedor,items,pago,pagoEf,fecha,silent}){
  fecha=fecha||now();
  const sale={id:uid('v'),num:S.sales.length+1001,fecha,vendedor,lineas:[],estado:'vigente',pagos:[],cierre:''};
  for(const it of items){
    const p=P(it.prod);
    const qty=p.unidad==='kg'?round2(it.qty):Math.round(it.qty);
    const alloc=fifo(p.id,qty,fecha);
    if(!alloc)throw new Error(`No alcanza el stock de ${p.nombre}. Quedan ${qtyFmt(prodStock(p.id),p.unidad)}.`);
    sale.lineas.push({prod:p.id,unidad:p.unidad,qty,precio:p.precio,subtotal:lineTotal(p,qty),allocs:alloc});
  }
  sale.total=sale.lineas.reduce((a,l)=>a+l.subtotal,0);
  if(pago==='mixto'){const ef=Math.min(pagoEf||0,sale.total);sale.pagos=[{medio:'efectivo',monto:ef},{medio:'transferencia',monto:sale.total-ef}]}
  else sale.pagos=[{medio:pago,monto:sale.total}];
  sale.lineas.forEach(ln=>ln.allocs.forEach(a=>S.moves.push({id:uid('m'),lot:a.lot,prod:ln.prod,tipo:'venta',qty:-a.qty,user:vendedor,fecha,motivo:'',ref:sale.id})));
  S.sales.push(sale);
  if(!silent)save();
  return sale;
}
const saleCash=s=>s.pagos.filter(p=>p.medio==='efectivo').reduce((a,p)=>a+p.monto,0);
const saleTr=s=>s.pagos.filter(p=>p.medio==='transferencia').reduce((a,p)=>a+p.monto,0);
const vig=s=>s.estado==='vigente';

/* ---------- sesión y navegación ---------- */
let me=null,view='dash',ui={fam:'Todas',q:'',cart:[],pago:'efectivo',pagoEf:0,recTab:'rec',salesTab:'list'};
const isAdmin=()=>me&&me.rol==='admin';
const MENU=[
  {id:'dash',t:'Dashboard',i:'dash',admin:true},
  {id:'pos',t:'Punto de venta',i:'pos'},
  {id:'rec',t:'Recepción / Merma',i:'rec'},
  {id:'inv',t:'Inventario',i:'inv'},
  {id:'sales',t:'Historial de ventas',tv:'Mis ventas',i:'sales'},
  {id:'moves',t:'Movimientos',i:'moves',admin:true},
  {id:'prod',t:'Productores',i:'prod',admin:true},
  {id:'gastos',t:'Gastos',i:'exp',admin:true},
  {id:'bal',t:'Balance',i:'bal',admin:true},
  {id:'rep',t:'Reportes',i:'rep',admin:true},
  {id:'users',t:'Usuarios y ajustes',i:'users',admin:true},
];
const menu=()=>MENU.filter(m=>!m.admin||isAdmin());
function go(v){view=v;ui.q='';render();window.scrollTo(0,0)}
function logout(){me=null;try{sessionStorage.removeItem('bodegaLV.me')}catch(e){}render()}

let toastT;
function toast(msg){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el)}el.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2600)}
function modal(html,wide){closeModal();const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="modal ${wide?'wide':''}">${html}</div>`;o.addEventListener('click',e=>{if(e.target===o)closeModal()});document.body.appendChild(o)}
function closeModal(){document.querySelectorAll('.ov').forEach(o=>o.remove())}
function audit(accion,entidad,antes,despues){S.audit.push({id:uid('a'),user:me.id,accion,entidad,antes:String(antes??''),despues:String(despues??''),fecha:now()})}

/* ---------- login ---------- */
function viewLogin(){
  return `<div class="login"><form class="box" onsubmit="event.preventDefault();doLogin()">
    <div style="display:flex;justify-content:center;margin-bottom:14px">${LOGO(120)}</div>

function doLogin(){

let flashSku=null;
function priceStrip(clickable){

/* ---------- 1. DASHBOARD ---------- */
function dayStats(key){
  const ss=S.sales.filter(s=>vig(s)&&dayKey(s.fecha)===key);
  let gam=0,kgs=0;ss.forEach(s=>s.lineas.forEach(l=>l.unidad==='kg'?kgs+=l.qty:gam+=l.qty));
  return {ss,total:ss.reduce((a,s)=>a+s.total,0),n:ss.length,gam,kgs};
}
function getAlerts(){
  const a=[];
  S.lots.forEach(l=>{const s=lotStock(l.id);const d=Math.floor((now()-l.fecha)/DAY);if(s>0&&d>=4)a.push({t:'bad',m:`Lote con ${d} días: ${P(l.prod).nombre} de ${PR(l.productor).nombre} (${qtyFmt(s,P(l.prod).unidad)})`})});
  S.closures.filter(c=>!c.aprobado&&c.diferencia!==0).forEach(c=>a.push({t:'bad',m:`Diferencia de caja ${clp(c.diferencia)} — ${U(c.vendedor).nombre}`}));
  return a;
}
function showAlerts(){const a=getAlerts();modal(`<h2>Alertas</h2><div class="rows" style="margin-top:8px">${a.length?a.map(x=>`<div><span class="pill ${x.t}">●</span><div class="grow">${esc(x.m)}</div></div>`).join(''):'<div class="empty">Sin alertas</div>'}</div><div class="acts"><button class="btn ghost" onclick="closeModal()">Cerrar</button></div>`)}
function viewDash(){
  const k=today(),st=dayStats(k);
  // últimos 7 días, del más reciente al más antiguo
  const DN=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const days=[...Array(7)].map((_,i)=>{const t=now()-i*DAY;const s=dayStats(dayKey(t));return{l:i===0?'Hoy':i===1?'Ayer':DN[new Date(t-S.cfg.inicioJornada*36e5).getDay()],f:fdate(t-S.cfg.inicioJornada*36e5).slice(0,5),v:s.total,n:s.n}});
  const max=Math.max(...days.map(d=>d.v),1);
  const week=days.reduce((a,d)=>a+d.v,0);
  // llegó hoy vs. restantes
  const llego={};S.moves.filter(m=>m.tipo==='recepción'&&dayKey(m.fecha)===k).forEach(m=>llego[m.prod]=(llego[m.prod]||0)+m.qty);
  // por vendedor y medio
  const byV={};st.ss.forEach(s=>{byV[s.vendedor]=(byV[s.vendedor]||0)+s.total});
  const ef=st.ss.reduce((a,s)=>a+saleCash(s),0),tr=st.ss.reduce((a,s)=>a+saleTr(s),0);
  const fam={};st.ss.forEach(s=>s.lineas.forEach(l=>{const f=P(l.prod).familia;fam[f]=(fam[f]||0)+l.subtotal}));
  return head('Dashboard',`Así está la bodega hoy, ${fdate(now())} · jornada desde las ${pad2(S.cfg.inicioJornada)}:00`,
    `<button class="btn pri" onclick="go('rec')">${ic('plus',18)}Recepción</button><button class="btn" onclick="go('rep')">Reportes</button>`)+
  `<div class="grid g4">
    <div class="card kpi hero"><div class="lbl">Ventas de hoy<span class="arrow">${ic('arrow',15)}</span></div><div class="val num">${clp(st.total)}</div></div>
    <div class="card kpi"><div class="lbl">N° de ventas hoy<span class="arrow">${ic('arrow',15)}</span></div><div class="val num">${st.n}</div></div>
    <div class="card kpi"><div class="lbl">Efectivo hoy</div><div class="val num">${clp(ef)}</div><div class="sub">${st.ss.filter(s=>saleCash(s)).length} ventas</div></div>
    <div class="card kpi"><div class="lbl">Transferencias hoy</div><div class="val num">${clp(tr)}</div><div class="sub">${st.ss.filter(s=>saleTr(s)).length} ventas</div></div>
  </div>
  <div class="grid g3" style="margin-top:14px">
    <div class="card span2"><h3>Llegó hoy y restantes<span class="muted" style="font-size:12px;font-weight:500">a las ${ftime(now())}</span></h3>
      <div class="scroll"><table class="tbl"><thead><tr><th>Producto</th><th class="right">Llegó hoy</th><th class="right">Restantes</th></tr></thead><tbody>
      ${S.products.filter(p=>p.activo).map(p=>{const l=llego[p.id]||0,q=prodStock(p.id);
        return `<tr class="click" onclick="productSheet('${p.id}')"><td><b>${esc(p.nombre)}</b></td><td class="right num">${l?qtyFmt(l,p.unidad):'<span class="muted">—</span>'}</td><td class="right num"><b>${q>0?qtyFmt(q,p.unidad):'<span class="pill bad">Sin stock</span>'}</b></td></tr>`}).join('')}
      </tbody></table></div>
    </div>
    <div class="card"><h3>Últimos 7 días<span class="pill ok">${clp(week)}</span></h3>
      <div class="rows">${days.map((d,i)=>`<div style="flex-wrap:wrap;gap:4px 12px"><div class="grow"><b>${d.l}</b><span>${d.f} · ${d.n} ventas</span></div><b class="num">${clp(d.v)}</b><div style="flex-basis:100%;height:6px;border-radius:99px;background:var(--soft)"><div style="height:100%;width:${d.v/max*100}%;border-radius:99px;background:${i===0?'var(--g900)':'var(--g500)'}"></div></div></div>`).join('')}</div>
    </div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>Ventas por vendedor</h3><div class="rows">${S.users.filter(u=>u.activo).map(u=>`<div><span class="avatar" style="width:36px;height:36px;font-size:13px">${esc(u.nombre[0])}</span><div class="grow"><b>${esc(u.nombre)}</b><span>${st.ss.filter(s=>s.vendedor===u.id).length} ventas</span></div><b class="num">${clp(byV[u.id]||0)}</b></div>`).join('')}</div></div>
    <div class="card"><h3>Ventas de hoy por familia</h3><div class="rows">
      ${['Tomate','Palta','Otros'].map(f=>`<div><span class="ico ${f==='Tomate'?'t':f==='Palta'?'p':'o'}">${f[0]}</span><div class="grow"><b>${f}</b></div><b class="num">${clp(fam[f]||0)}</b></div>`).join('')}
    </div></div>
  </div>`;
}

/* ---------- 2. PUNTO DE VENTA ---------- */
function filteredProducts(adminAll){
  const q=ui.q.trim().toLowerCase();
  return S.products.filter(p=>(adminAll||(p.activo&&!p.envase))&&(ui.fam==='Todas'||p.familia===ui.fam)&&(!q||p.nombre.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)||p.calibre.toLowerCase().includes(q)));
}
function famChips(){return `<div class="tabs">${['Todas','Tomate','Palta','Otros'].map(f=>`<button class="btn sm ${ui.fam===f?'pri':'ghost'}" onclick="ui.fam='${f}';render()">${f}</button>`).join('')}</div>`}
function cartQty(pid){return pid===gamId()?ui.cart.filter(c=>c.gam).reduce((a,c)=>a+c.qty,0):ui.cart.filter(c=>c.prod===pid).reduce((a,c)=>a+c.qty,0)}
function viewPOS(){
  const ps=filteredProducts();
  const vg=gamProd().precio;
  const items=ui.cart.map((c,i)=>{const p=P(c.prod);return{...c,p,i,sub:lineTotal(p,c.qty),gsub:c.gam?c.qty*vg:0}});
  const total=items.reduce((a,c)=>a+c.sub+c.gsub,0);
  return head('Punto de venta','Toca un producto para agregarlo. Mantén presionado para consultar el precio sin vender.')+
  `<div class="pos"><div>
    ${suggestBox()}
    ${famChips()}
    <div class="prods">${ps.map(p=>{const s=prodStock(p.id)-cartQty(p.id);return `<button class="prod ${s<=0?'out':''}" onclick="openItem('${p.id}')" oncontextmenu="event.preventDefault();priceCheck('${p.id}')">
      <span class="muted" style="font-size:11px">${p.sku}</span><span class="nm">${esc(p.nombre)}</span>
      <span class="st">${s<=0?'<span class="pill bad">Sin stock</span>':'Quedan '+qtyFmt(s,p.unidad)}</span>
      <span class="pr num">${clp(p.precio)}<small style="font-size:12px;font-weight:600">${p.unidad==='kg'?' /kg':' /gamela'}</small></span></button>`}).join('')||'<div class="empty">Sin resultados</div>'}</div>
  </div>
  <div class="card cart"><h3>Venta actual<span class="pill mute">${esc(me.nombre)}</span></h3>
    ${items.length?items.map(c=>`<div class="line"><div class="grow"><b>${esc(c.p.nombre)}</b><small>${qtyFmt(c.qty,c.p.unidad)}${c.p.unidad==='kg'&&c.cajas?` (${c.cajas} caja${c.cajas>1?'s':''})`:''} × ${clp(c.p.precio)}</small>${c.gam?`<small style="color:var(--g700);font-weight:600">+ ${c.qty} gamela${c.qty>1?'s':''} × ${clp(vg)} = ${clp(c.gsub)}</small>`:''}</div><b class="num">${clp(c.sub+c.gsub)}</b><button class="x" onclick="ui.cart.splice(${c.i},1);render()">✕</button></div>`).join(''):'<div class="empty">Agrega productos desde la lista</div>'}
    <div class="f"><label>Medio de pago</label><div class="seg">${['efectivo','transferencia','mixto'].map(m=>`<button class="${ui.pago===m?'on':''}" onclick="ui.pago='${m}';render()">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div></div>
    ${ui.pago==='mixto'?`<div class="f"><label>Monto en efectivo (resto transferencia)</label><input class="in num" type="number" inputmode="numeric" value="${ui.pagoEf||''}" onchange="ui.pagoEf=parseInt(this.value)||0;render()"><small class="muted">Transferencia: ${clp(Math.max(0,total-(ui.pagoEf||0)))}</small></div>`:''}
    <div class="total"><span>Total</span><span class="num">${clp(total)}</span></div>
    <button class="btn pri big" ${items.length?'':'disabled'} onclick="confirmSale()">Confirmar venta</button>
  </div></div>`;
}
function suggestBox(){
  const q=ui.q.trim();
  const sug=q?filteredProducts().slice(0,6):[];
  return `<div style="position:relative;margin-bottom:10px">
    <label class="search" style="max-width:none;border:1.5px solid var(--line);min-height:50px">${ic('search',18)}<input placeholder="Buscar por nombre, calibre o SKU" value="${esc(ui.q)}" oninput="ui.q=this.value;render(true)" onkeydown="if(event.key==='Escape'){ui.q='';render()}if(event.key==='Enter'){const p=filteredProducts()[0];if(p){ui.q='';openItem(p.id)}}" autocomplete="off">${q?`<button class="x" onclick="ui.q='';render()">✕</button>`:''}</label>
    ${sug.length?`<div class="sug">${sug.map(p=>{const st=prodStock(p.id)-cartQty(p.id);return `<button onclick="ui.q='';openItem('${p.id}')"><span class="ico ${p.familia==='Tomate'?'t':p.familia==='Palta'?'p':'o'}">${esc(p.calibre.slice(0,3))}</span><span class="grow"><b>${hl(p.nombre,q)}</b><small>${hl(p.sku,q)} · ${st>0?'quedan '+qtyFmt(st,p.unidad):'sin stock'}</small></span><b class="num">${clp(p.precio)}${p.unidad==='kg'?'/kg':''}</b></button>`}).join('')}</div>`:q?'<div class="sug"><div class="empty" style="padding:14px">Sin coincidencias</div></div>':''}
  </div>`;
}
function hl(t,q){const i=t.toLowerCase().indexOf(q.toLowerCase());return i<0?esc(t):esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length))}
function priceCheck(pid){const p=P(pid);modal(`<p class="muted" style="margin:0">Consulta de precio · ${p.sku}</p><h2>${esc(p.nombre)}</h2><div class="kpi"><div class="val num" style="color:var(--g800)">${clp(p.precio)}${p.unidad==='kg'?'<small style="font-size:16px"> /kg</small>':''}</div></div><p>Stock actual: <b>${qtyFmt(prodStock(pid),p.unidad)}</b>${p.unidad==='kg'?` · Caja de ${p.pesoCaja} kg = ${clp(p.pesoCaja*p.precio)}`:''}</p><div class="acts"><button class="btn ghost" onclick="closeModal()">Cerrar</button><button class="btn pri" onclick="openItem('${pid}')">Vender</button></div>`)}
let itemSt={};
function openItem(pid){
  const p=P(pid);const avail=prodStock(pid)-cartQty(pid);
  itemSt={pid,mode:p.unidad==='kg'?'cajas':'gamela',qty:1,gam:false};
  if(avail<=0){toast(`Sin stock de ${p.nombre}`);return}
  drawItem();
}
function drawItem(){
  const p=P(itemSt.pid);
  modal(`<p class="muted" style="margin:0">${p.sku} · ${clp(p.precio)}${p.unidad==='kg'?'/kg · caja '+p.pesoCaja+' kg':'/gamela'}</p><h2>${esc(p.nombre)}</h2>
  <p class="muted" style="margin:2px 0 14px">Quedan <b id="it_left" style="color:var(--ink)"></b> después de esta venta</p>
  ${p.unidad==='kg'?`<div class="seg" id="it_seg" style="margin-bottom:12px"><button data-m="cajas" onclick="itemMode('cajas')">Por cajas</button><button data-m="kg" onclick="itemMode('kg')">Por kilos</button></div>`:''}
  <div class="f"><label id="it_lbl"></label>
  <div class="stepper"><button onclick="itemStep(-1)">−</button><input id="it_q" class="in num" type="number" inputmode="decimal" oninput="itemSt.qty=Math.max(0,parseFloat(this.value.replace(',','.'))||0);updItem()" onkeydown="if(event.key==='Enter'&&!$('#it_ok').disabled)addItem()"><button onclick="itemStep(1)">+</button></div></div>
  <p class="muted" id="it_kg"></p>
  ${p.usaGamela?`<label class="gamchk"><input type="checkbox" id="it_gam" onchange="itemSt.gam=this.checked;updItem()"><span><b>Gamela</b><small id="it_gtxt"></small></span></label>`:''}
  <div class="total"><span>Subtotal</span><span class="num" id="it_sub"></span></div>
  <div class="err" id="it_err"></div>
  <div class="acts"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn pri" id="it_ok" onclick="addItem()">Agregar</button></div>`);
  $('#it_q').value=itemSt.qty;updItem();
}
// actualiza solo los valores de la ventana, sin redibujarla
function itemStep(d){itemSt.qty=Math.max(0,round2(itemSt.qty+d));$('#it_q').value=itemSt.qty;updItem()}
function itemMode(m){const p=P(itemSt.pid);itemSt.mode=m;itemSt.qty=m==='cajas'?1:p.pesoCaja;$('#it_q').value=itemSt.qty;updItem()}
function updItem(){
  const p=P(itemSt.pid),avail=prodStock(p.id)-cartQty(p.id);
  const kgv=p.unidad==='kg'?(itemSt.mode==='cajas'?itemSt.qty*p.pesoCaja:itemSt.qty):itemSt.qty;
  const min=p.unidad==='kg'?p.pesoCaja:1;
  const bad=kgv>avail+1e-9?`No alcanza: quedan ${qtyFmt(avail,p.unidad)}`:kgv<min-1e-9?`Venta mínima: ${p.unidad==='kg'?p.pesoCaja+' kg (1 caja)':'1 gamela'}`:'';
  $('#it_left').textContent=qtyFmt(Math.max(0,avail-kgv),p.unidad);
  $('#it_lbl').textContent=p.unidad==='gamela'?'Gamelas':itemSt.mode==='cajas'?'Cajas':'Kilos';
  $('#it_kg').textContent=p.unidad==='kg'?`${kg(kgv)} kg × ${clp(p.precio)}`:'';
  let err=bad;
  if(p.usaGamela){
    const gq=Math.round(kgv),ga=prodStock(gamId())-cartQty(gamId());
    $('#it_gtxt').textContent=itemSt.gam?`+ ${gq} × ${clp(gamProd().precio)} = ${clp(gq*gamProd().precio)} · quedan ${Math.max(0,ga-gq)} gamelas`:`Cobrar ${clp(gamProd().precio)} por cada gamela que se lleva`;
    if(itemSt.gam&&gq>ga&&!err)err=`Solo quedan ${ga} gamelas en bodega`;
  }
  $('#it_sub').textContent=clp(lineTotal(p,kgv)+(p.usaGamela&&itemSt.gam?Math.round(kgv)*gamProd().precio:0));
  $('#it_err').textContent=err;
  $('#it_ok').disabled=!!err;
  document.querySelectorAll('#it_seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===itemSt.mode));
}
function addItem(){
  const p=P(itemSt.pid);const qty=p.unidad==='kg'?round2(itemSt.mode==='cajas'?itemSt.qty*p.pesoCaja:itemSt.qty):Math.round(itemSt.qty);
  ui.cart.push({prod:p.id,qty,cajas:p.unidad==='kg'&&itemSt.mode==='cajas'?itemSt.qty:0,gam:!!(p.usaGamela&&itemSt.gam)});
  closeModal();if(view!=='pos')view='pos';render();toast(`${p.nombre}: quedan ${qtyFmt(prodStock(p.id)-cartQty(p.id),p.unidad)}`);
}
function confirmSale(){
  const items=ui.cart.map(c=>({prod:c.prod,qty:c.qty}));
  const g=cartQty(gamId());if(g)items.push({prod:gamId(),qty:g});
  try{
    const s=makeSale({vendedor:me.id,items,pago:ui.pago,pagoEf:ui.pagoEf});
    ui.cart=[];ui.pago='efectivo';ui.pagoEf=0;render();receipt(s.id);
  }catch(e){toast(e.message)}
}
function saleText(s){
  return `*${S.cfg.nombre}*\nComprobante interno N° ${s.num}\n${fdt(s.fecha)} · Vendedor: ${U(s.vendedor).nombre}\n\n`+
    s.lineas.map(l=>`${P(l.prod).nombre}: ${qtyFmt(l.qty,l.unidad)} x ${clp(l.precio)} = ${clp(l.subtotal)}`).join('\n')+
    `\n\n*Total: ${clp(s.total)}*\nPago: ${s.pagos.map(p=>p.medio+' '+clp(p.monto)).join(' + ')}`;
}
function receipt(id){
  const s=S.sales.find(x=>x.id===id);
  modal(`<div class="printable doc"><div class="hd">${LOGO(44)}<div><b style="font-size:16px">${esc(S.cfg.nombre)}</b><br><span class="muted">RUT ${esc(S.cfg.rut)} · Comprobante interno N° ${s.num}</span></div></div>
  ${s.estado==='anulada'?`<p><span class="pill bad">ANULADA</span> ${esc(s.motivoAnula||'')}</p>`:''}
  <p class="muted" style="margin:0 0 8px">${fdt(s.fecha)} · Vendedor: <b>${esc(U(s.vendedor).nombre)}</b></p>
  <table class="tbl"><tbody>${s.lineas.map(l=>`<tr><td>${esc(P(l.prod).nombre)}<br><small class="muted">${qtyFmt(l.qty,l.unidad)} × ${clp(l.precio)}</small></td><td class="right num">${clp(l.subtotal)}</td></tr>`).join('')}
  </tbody></table>
  <div class="total"><span>Total</span><span class="num">${clp(s.total)}</span></div>
  <p class="muted" style="margin:0">Pago: ${s.pagos.filter(p=>p.monto).map(p=>`${p.medio} ${clp(p.monto)}`).join(' + ')}</p></div>
  <div class="acts noprint"><button class="btn ghost" onclick="window.print()">${ic('print',17)}Imprimir</button><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(saleText(s))}">${ic('wa',17)}WhatsApp</a><button class="btn pri" onclick="closeModal()">Listo</button></div>`);
}

/* ---------- 3. RECEPCIÓN / MERMA ---------- */
let recForm=null;
function newRecForm(){recForm={productor:S.producers[0]?.id||'',modalidad:'consignación',pallets:'',foto:'',lineas:[{prod:S.products[0].id,qty:'',costo:''}]}}
function viewRec(){
  if(!recForm)newRecForm();
  const t=ui.recTab;
  return head('Recepción / Merma','Lo que registras queda disponible para vender al tiro.')+
  `<div class="big2"><button class="bigbtn ${t==='rec'?'on':''}" onclick="ui.recTab='rec';render()">${ic('rec',28)}<b>Recepción de producto</b><span>Llegó un camión o un productor</span></button>
  <button class="bigbtn ${t==='merma'?'on':''}" onclick="ui.recTab='merma';render()">${ic('moves',28)}<b>Merma</b><span>Producto podrido, dañado o reacondicionado</span></button></div>
  ${t==='rec'?recView():mermaView()}`;
}
function recView(){
  const f=recForm;
  const tot=f.lineas.reduce((a,l)=>{const p=P(l.prod);return{g:a.g+(p.unidad==='gamela'?+l.qty||0:0),k:a.k+(p.unidad==='kg'?+l.qty||0:0),c:a.c+(+l.qty||0)*(+l.costo||0)}},{g:0,k:0,c:0});
  const recent=S.receptions.slice().sort((a,b)=>b.fecha-a.fecha).slice(0,8);
  return `<div class="grid g3 stack"><div class="card span2"><h3>Nueva recepción<span class="muted" style="font-size:12px;font-weight:500">${fdt(now())}</span></h3>
    <div class="row"><div class="f"><label>Productor o proveedor</label><select class="in" onchange="recForm.productor=this.value;const pr=PR(this.value);recForm.modalidad=pr.tipo==='proveedor'?'compra':'consignación';render()">${S.producers.map(p=>`<option value="${p.id}" ${f.productor===p.id?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select></div>
    <div class="f"><label>Modalidad</label><div class="seg">${['consignación','compra'].map(m=>`<button class="${f.modalidad===m?'on':''}" onclick="recForm.modalidad='${m}';render()">${m==='compra'?'Compra directa':'Consignación'}</button>`).join('')}</div></div></div>
    ${f.lineas.map((l,i)=>{const p=P(l.prod);return `<div class="row" style="align-items:flex-end;border-top:1px dashed var(--line);padding-top:10px">
      <div class="f" style="flex:2"><label>Producto</label><select class="in" onchange="recForm.lineas[${i}].prod=this.value;render()">${S.products.filter(x=>x.activo&&!x.envase).map(x=>`<option value="${x.id}" ${l.prod===x.id?'selected':''}>${esc(x.nombre)}</option>`).join('')}</select></div>
      <div class="f"><label>${p.unidad==='kg'?'Kg totales':'Gamelas'}</label><input class="in num" type="number" inputmode="decimal" placeholder="0" value="${l.qty}" onchange="recForm.lineas[${i}].qty=this.value;render()">${p.unidad==='kg'&&l.qty?`<small class="muted">≈ ${Math.round(l.qty/p.pesoCaja)} cajas</small>`:''}</div>
      ${f.modalidad==='compra'?`<div class="f"><label>Costo ${p.unidad==='kg'?'/kg':'/gamela'}</label><input class="in num" type="number" inputmode="numeric" placeholder="$" value="${l.costo}" onchange="recForm.lineas[${i}].costo=this.value;render()"></div>`:''}
      <div class="f" style="flex:0"><button class="x" style="height:46px;width:46px" onclick="recForm.lineas.splice(${i},1);if(!recForm.lineas.length)recForm.lineas.push({prod:S.products[0].id,qty:'',costo:''});render()">✕</button></div></div>`}).join('')}
    <button class="btn ghost sm" onclick="recForm.lineas.push({prod:S.products[0].id,qty:'',costo:''});render()">${ic('plus',16)}Agregar producto</button>
    <div class="row" style="margin-top:14px"><div class="f"><label>Pallets (informativo)</label><input class="in" type="number" inputmode="numeric" value="${f.pallets}" onchange="recForm.pallets=this.value"></div>
    <div class="f"><label>Foto de la guía (opcional)</label><input class="in" type="file" accept="image/*" capture="environment" style="padding-top:10px" onchange="recForm.foto=this.files[0]?.name||''"></div></div>
    <div class="total" style="font-size:18px"><span>Total recepción</span><span class="num">${tot.g?tot.g+' gamelas':''}${tot.g&&tot.k?' · ':''}${tot.k?kg(tot.k)+' kg':''}${!tot.g&&!tot.k?'—':''}${f.modalidad==='compra'&&tot.c?' · '+clp(tot.c):''}</span></div>
    <button class="btn pri big" onclick="saveRec()">Guardar recepción</button>
  </div>
  <div class="card"><h3>Últimas recepciones</h3><div class="rows">${recent.map(r=>`<div style="cursor:pointer" onclick="recDoc('${r.id}')"><span class="ico ${r.modalidad==='compra'?'o':'p'}">${r.modalidad==='compra'?'C':'P'}</span><div class="grow"><b>${esc(PR(r.productor).nombre)}</b><span>${fdt(r.fecha)} · ${esc(U(r.user).nombre)}</span></div>${r.anulada?'<span class="pill bad">Anulada</span>':`<b class="num">${r.lineas.reduce((a,l)=>a+l.qty,0)}</b>`}</div>`).join('')}</div></div></div>`;
}
function saveRec(){
  const f=recForm;const ls=f.lineas.filter(l=>+l.qty>0);
  if(!ls.length){toast('Ingresa al menos una cantidad');return}
  const t=now();const r={id:uid('r'),fecha:t,productor:f.productor,modalidad:f.modalidad,pallets:+f.pallets||0,foto:f.foto,user:me.id,anulada:false,lineas:[]};
  ls.forEach(l=>{const p=P(l.prod);const q=p.unidad==='kg'?round2(+l.qty):Math.round(+l.qty);const lot={id:uid('l'),rec:r.id,prod:p.id,qty:q,costo:+l.costo||0,fecha:t,productor:f.productor,modalidad:f.modalidad};S.lots.push(lot);r.lineas.push({prod:p.id,qty:q,costo:lot.costo,lot:lot.id});S.moves.push({id:uid('m'),lot:lot.id,prod:p.id,tipo:'recepción',qty:q,user:me.id,fecha:t,motivo:'',ref:r.id})});
  S.receptions.push(r);save();newRecForm();render();recDoc(r.id);toast('Recepción guardada · stock disponible');
}
function recDoc(id){
  const r=S.receptions.find(x=>x.id===id);const pr=PR(r.productor);
  modal(`<div class="printable doc"><div class="hd">${LOGO(44)}<div><b style="font-size:16px">${esc(S.cfg.nombre)}</b><br><span class="muted">RUT ${esc(S.cfg.rut)} · Comprobante de recepción</span></div></div>
  ${r.anulada?'<p><span class="pill bad">ANULADA</span></p>':''}
  <p style="margin:0 0 4px"><b>${esc(pr.nombre)}</b> ${pr.rut?'· RUT '+esc(pr.rut):''}</p>
  <p class="muted" style="margin:0 0 10px">${fdt(r.fecha)} · ${r.modalidad==='compra'?'Compra directa':'Consignación ('+(pr.comision??S.cfg.comision)+'% comisión)'} · Recibió: ${esc(U(r.user).nombre)}${r.pallets?' · '+r.pallets+' pallets':''}${r.foto?' · guía: '+esc(r.foto):''}</p>
  <table class="tbl"><thead><tr><th>Producto</th><th class="right">Cantidad</th>${r.modalidad==='compra'?'<th class="right">Costo</th>':''}</tr></thead><tbody>${r.lineas.map(l=>{const p=P(l.prod);return `<tr><td>${esc(p.nombre)}</td><td class="right num">${qtyFmt(l.qty,p.unidad)}</td>${r.modalidad==='compra'?`<td class="right num">${clp(l.qty*l.costo)}</td>`:''}</tr>`}).join('')}</tbody></table>
  <p style="margin-top:30px" class="muted">Firma recepción: ______________________</p></div>
  <div class="acts noprint">${isAdmin()&&!r.anulada?`<button class="btn bad" onclick="voidRec('${r.id}')">Anular</button>`:''}<button class="btn ghost" onclick="window.print()">${ic('print',17)}PDF / Imprimir</button><button class="btn pri" onclick="closeModal()">Listo</button></div>`);
}
function voidRec(id){
  askReason('Anular recepción','Se descontará del stock lo que aún quede de estos lotes.',m=>{
    const r=S.receptions.find(x=>x.id===id);
    for(const l of r.lineas){if(lotStock(l.lot)<l.qty-1e-9){toast('No se puede anular: parte del lote ya se vendió. Ajusta el stock en su lugar.');return}}
    r.lineas.forEach(l=>S.moves.push({id:uid('m'),lot:l.lot,prod:l.prod,tipo:'anulación',qty:-l.qty,user:me.id,fecha:now(),motivo:m,ref:r.id}));
    r.anulada=true;audit('Anula recepción','Recepción '+PR(r.productor).nombre,'vigente','anulada: '+m);save();closeModal();render();toast('Recepción anulada');
  });
}
let mermaF={prod:'',lot:'',qty:'',motivo:'podrido',buenas:''};
function mermaView(){
  if(!mermaF.prod)mermaF.prod=S.products[0].id;
  const p=P(mermaF.prod);const lots=prodLots(p.id).filter(l=>lotStock(l.id)>0);
  if(!lots.find(l=>l.id===mermaF.lot))mermaF.lot=lots[0]?.id||'';
  const ls=mermaF.lot?lotStock(mermaF.lot):0;
  const last=S.moves.filter(m=>m.tipo==='merma').sort((a,b)=>b.fecha-a.fecha).slice(0,8);
  const disabled=!isAdmin()&&false; // a confirmar con Luis si el vendedor puede registrar merma
  return `<div class="grid g3 stack"><div class="card span2"><h3>Registrar merma</h3>
  <div class="row"><div class="f"><label>Producto</label><select class="in" onchange="mermaF.prod=this.value;mermaF.lot='';render()">${S.products.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.nombre)}</option>`).join('')}</select></div>
  <div class="f"><label>Lote</label><select class="in" onchange="mermaF.lot=this.value;render()">${lots.map(l=>`<option value="${l.id}" ${l.id===mermaF.lot?'selected':''}>${fdate(l.fecha)} · ${esc(PR(l.productor).nombre)} · quedan ${qtyFmt(lotStock(l.id),p.unidad)}</option>`).join('')||'<option>Sin lotes con stock</option>'}</select></div></div>
  <div class="f"><label>Motivo</label><div class="seg">${['podrido','dañado','descarte','reacondicionado'].map(m=>`<button class="${mermaF.motivo===m?'on':''}" onclick="mermaF.motivo='${m}';render()">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div></div>
  ${mermaF.motivo==='reacondicionado'?`<div class="row"><div class="f"><label>${p.unidad==='kg'?'Kg':'Gamelas'} revisadas</label><input class="in num" type="number" value="${mermaF.rev||''}" onchange="mermaF.rev=this.value;mermaF.qty=Math.max(0,(+mermaF.rev||0)-(+mermaF.buenas||0));render()"></div><div class="f"><label>Quedaron buenas</label><input class="in num" type="number" value="${mermaF.buenas}" onchange="mermaF.buenas=this.value;mermaF.qty=Math.max(0,(+mermaF.rev||0)-(+mermaF.buenas||0));render()"></div></div>`:''}
  <div class="f"><label>Cantidad que se bota (${p.unidad==='kg'?'kg':'gamelas'})</label><input class="in num" type="number" inputmode="decimal" value="${mermaF.qty}" onchange="mermaF.qty=this.value;render()"></div>
  ${+mermaF.qty>ls?`<div class="err">El lote solo tiene ${qtyFmt(ls,p.unidad)}</div>`:''}
  <button class="btn pri big" ${!mermaF.lot||!(+mermaF.qty>0)||+mermaF.qty>ls||disabled?'disabled':''} onclick="saveMerma()">Confirmar merma</button></div>
  <div class="card"><h3>Últimas mermas</h3><div class="rows">${last.map(m=>`<div><span class="ico t">−</span><div class="grow"><b>${esc(P(m.prod).nombre)}</b><span>${fdt(m.fecha)} · ${esc(m.motivo)} · ${esc(U(m.user).nombre)}</span></div><b class="num">${qtyFmt(-m.qty,P(m.prod).unidad)}</b></div>`).join('')||'<div class="empty">Sin mermas</div>'}</div></div></div>`;
}
function saveMerma(){
  const p=P(mermaF.prod);const q=p.unidad==='kg'?round2(+mermaF.qty):Math.round(+mermaF.qty);
  S.moves.push({id:uid('m'),lot:mermaF.lot,prod:p.id,tipo:'merma',qty:-q,user:me.id,fecha:now(),motivo:mermaF.motivo,ref:''});
  save();mermaF={prod:p.id,lot:'',qty:'',motivo:'podrido',buenas:''};render();toast(`Merma registrada: ${qtyFmt(q,p.unidad)} de ${p.nombre}`);
}

/* ---------- 4. INVENTARIO ---------- */
function viewInv(){
  const ps=filteredProducts(isAdmin());const k=today();
  return head('Inventario',isAdmin()?'Catálogo, precios y stock. El stock es la suma de los movimientos; no se edita a mano.':'Stock y precio actual de cada producto.',
    isAdmin()?`<button class="btn pri" onclick="editProduct()">${ic('plus',18)}Nuevo producto</button>`:'')+
  `<div class="card"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between">${famChips()}<input class="in" style="max-width:280px;margin-bottom:14px" placeholder="Buscar nombre o SKU" value="${esc(ui.q)}" oninput="ui.q=this.value;render(true)"></div>
  <div class="scroll"><table class="tbl"><thead><tr>${isAdmin()?'<th>SKU</th>':''}<th>Producto</th>${isAdmin()?'<th>Familia</th><th>Unidad</th>':''}<th class="right">Precio</th><th class="right">Stock</th>${isAdmin()?'<th class="right">Llegó hoy</th><th class="right">Vendido hoy</th><th></th>':''}</tr></thead><tbody>
  ${ps.map(p=>{const s=prodStock(p.id);const ms=S.moves.filter(m=>m.prod===p.id&&dayKey(m.fecha)===k);const sum=t=>Math.abs(ms.filter(m=>m.tipo===t).reduce((a,m)=>a+m.qty,0));
    return `<tr class="click" onclick="${isAdmin()?`editProduct('${p.id}')`:`productSheet('${p.id}')`}">${isAdmin()?`<td class="muted">${p.sku}</td>`:''}<td><b>${esc(p.nombre)}</b>${p.activo?'':' <span class="pill mute">Inactivo</span>'}</td>${isAdmin()?`<td>${p.familia}</td><td>${p.unidad}${p.unidad==='kg'?` (caja ${p.pesoCaja} kg)`:''}</td>`:''}
    <td class="right num"><b>${clp(p.precio)}</b>${p.unidad==='kg'?'/kg':''}</td><td class="right num">${s<=0?'<span class="pill bad">0</span>':qtyFmt(s,p.unidad)}</td>
    ${isAdmin()?`<td class="right num">${qtyFmt(sum('recepción'),p.unidad)}</td><td class="right num">${qtyFmt(sum('venta'),p.unidad)}</td><td class="right" onclick="event.stopPropagation()" style="white-space:nowrap"><button class="btn sm pri" onclick="editProduct('${p.id}')">Editar</button> <button class="btn sm ghost" onclick="productSheet('${p.id}')">Lotes</button></td>`:''}</tr>`}).join('')}
  </tbody></table></div></div>`;
}
function productSheet(pid){
  const p=P(pid);const lots=prodLots(pid).filter(l=>lotStock(l.id)>0);
  const mv=S.moves.filter(m=>m.prod===pid).sort((a,b)=>b.fecha-a.fecha).slice(0,12);
  modal(`<p class="muted" style="margin:0">${p.sku} · ${p.familia} · calibre/variedad ${esc(p.calibre)}</p><h2>${esc(p.nombre)}</h2>
  <div class="grid g2" style="margin:14px 0"><div class="card kpi" style="background:var(--panel)"><div class="lbl">Precio</div><div class="val num" style="font-size:28px">${clp(p.precio)}${p.unidad==='kg'?'/kg':''}</div></div><div class="card kpi" style="background:var(--panel)"><div class="lbl">Stock</div><div class="val num" style="font-size:28px">${qtyFmt(prodStock(pid),p.unidad)}</div></div></div>
  <h3 style="font-size:15px;margin:6px 0">Lotes en bodega (se vende primero el más antiguo)</h3>
  <div class="scroll"><table class="tbl"><thead><tr><th>Ingreso</th><th>Productor</th><th>Modalidad</th><th class="right">Queda</th><th class="right">Días</th></tr></thead><tbody>${lots.map(l=>{const d=Math.floor((now()-l.fecha)/DAY);return `<tr><td>${fdate(l.fecha)}</td><td>${esc(PR(l.productor).nombre)}</td><td>${l.modalidad}</td><td class="right num">${qtyFmt(lotStock(l.id),p.unidad)}</td><td class="right"><span class="pill ${d>=4?'bad':d>=2?'warn':'ok'}">${d}</span></td></tr>`}).join('')||'<tr><td colspan="5" class="muted">Sin stock</td></tr>'}</tbody></table></div>
  ${isAdmin()?`<h3 style="font-size:15px;margin:14px 0 6px">Movimientos recientes</h3><div class="scroll"><table class="tbl"><tbody>${mv.map(m=>`<tr><td>${fdt(m.fecha)}</td><td>${m.tipo}</td><td>${esc(U(m.user).nombre)}</td><td class="right num" style="color:${m.qty<0?'var(--bad)':'var(--g700)'}">${m.qty>0?'+':''}${qtyFmt(m.qty,p.unidad)}</td></tr>`).join('')}</tbody></table></div>`:''}
  <div class="acts">${isAdmin()?`<button class="btn ghost" onclick="adjustStock('${pid}')">Ajustar stock</button><button class="btn ghost" onclick="editProduct('${pid}')">Editar</button><button class="btn" onclick="changePrice('${pid}')">Cambiar precio</button>`:''}<button class="btn pri" onclick="closeModal()">Cerrar</button></div>`,true);
}
function changePrice(pid){
  const p=P(pid);
  modal(`<h2>Cambiar precio</h2><p class="muted">${esc(p.nombre)} · actual ${clp(p.precio)}${p.unidad==='kg'?'/kg':'/gamela'}</p>
  <div class="f"><label>Nuevo precio ${p.unidad==='kg'?'por kg':'por gamela'}</label><input id="np" class="in num" type="number" inputmode="numeric" value="${p.precio}" style="font-size:22px;font-weight:700"></div>
  <p class="muted" style="font-size:12px">Los vendedores verán el aviso en la franja de precios. Las ventas anteriores mantienen su precio.</p>
  <div class="acts"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="setPrice('${pid}')">Guardar</button></div>`);
  setTimeout(()=>$('#np')?.select(),50);
}
function setPrice(pid){
  const p=P(pid),v=parseInt($('#np').value);if(!(v>0)){toast('Precio inválido');return}
  if(v!==p.precio){S.prices.push({prod:pid,precio:v,desde:now(),user:me.id});audit('Cambio de precio',p.nombre,clp(p.precio),clp(v));p.precio=v;flashSku=pid;setTimeout(()=>flashSku=null,4000);save()}
  closeModal();render();toast(`Nuevo precio ${p.nombre}: ${clp(v)}`);
}
function adjustStock(pid){
  const p=P(pid);const lots=prodLots(pid);
  modal(`<h2>Ajustar stock</h2><p class="muted">${esc(p.nombre)} · stock ${qtyFmt(prodStock(pid),p.unidad)}. Usa negativo para descontar.</p>
  <div class="f"><label>Lote</label><select id="al" class="in">${lots.slice().reverse().map(l=>`<option value="${l.id}">${fdate(l.fecha)} · ${esc(PR(l.productor).nombre)} · ${qtyFmt(lotStock(l.id),p.unidad)}</option>`).join('')}</select></div>
  <div class="f"><label>Cantidad (+/−)</label><input id="aq" class="in num" type="number"></div>
  <div class="f"><label>Motivo (obligatorio)</label><input id="am" class="in" placeholder="Ej: conteo físico"></div>
  <div class="acts"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="doAdjust('${pid}')">Registrar ajuste</button></div>`);
}
function doAdjust(pid){
  const p=P(pid),lot=$('#al').value,q=parseFloat($('#aq').value),m=$('#am').value.trim();
  if(!q||!m){toast('Cantidad y motivo son obligatorios');return}
  if(lotStock(lot)+q<0){toast('El lote quedaría negativo');return}
  S.moves.push({id:uid('m'),lot,prod:pid,tipo:'ajuste',qty:p.unidad==='kg'?round2(q):Math.round(q),user:me.id,fecha:now(),motivo:m,ref:''});save();closeModal();render();toast('Ajuste registrado');
}
function editProduct(pid){
  const p=pid?P(pid):{sku:'',nombre:'',familia:'Tomate',calibre:'',unidad:'gamela',precio:'',pesoCaja:15,usaGamela:true,activo:true};
  modal(`<h2>${pid?'Editar':'Nuevo'} producto</h2>

function saveProduct(pid){
  const g=id=>$('#'+id);const d={sku:g('e_sku').value.trim().toUpperCase(),nombre:g('e_nom').value.trim(),familia:g('e_fam').value,calibre:g('e_cal').value.trim()||'—',unidad:g('e_uni').value,pesoCaja:+g('e_pes').value||0,usaGamela:g('e_gam').checked,activo:g('e_act').checked};
  if(!d.sku||!d.nombre){toast('SKU y nombre son obligatorios');return}
  if(S.products.some(x=>x.sku===d.sku&&x.id!==pid)){toast('Ese SKU ya existe');return}
  if(d.unidad==='kg'&&!d.pesoCaja){toast('Ingresa el peso base de la caja');return}
  const pr=+g('e_pre').value;if(!(pr>0)){toast('Ingresa el precio');return}
  if(pid){const p=P(pid);
    if(pr!==p.precio){S.prices.push({prod:pid,precio:pr,desde:now(),user:me.id});audit('Cambio de precio',p.nombre,clp(p.precio),clp(pr));flashSku=pid;setTimeout(()=>flashSku=null,4000)}
    const ch=Object.keys(d).filter(k=>String(p[k])!==String(d[k]));
    if(ch.length)audit('Edita producto',p.nombre,ch.map(k=>k+': '+p[k]).join(', '),ch.map(k=>k+': '+d[k]).join(', '));
    Object.assign(p,d,{precio:pr})}
  else{S.products.push({id:uid('p'),...d,precio:pr});audit('Crea producto',d.nombre,'',clp(pr))}
  save();closeModal();render();toast('Producto guardado');
}

/* ---------- 8. PRODUCTORES Y LIQUIDACIONES ---------- */
let lf={prod:'',desde:'',hasta:''};
function liqCalc(prodId,desde,hasta){
  const lots=S.lots.filter(l=>l.productor===prodId&&l.modalidad==='consignación'&&!S.receptions.find(r=>r.id===l.rec)?.anulada);
  const ids=new Set(lots.map(l=>l.id));const inR=t=>(!desde||dayKey(t)>=desde)&&(!hasta||dayKey(t)<=hasta);
  const by={};const add=(pid)=>by[pid]||(by[pid]={recibido:0,vendido:0,monto:0,merma:0});
  lots.filter(l=>inR(l.fecha)).forEach(l=>add(l.prod).recibido+=l.qty);
  S.sales.filter(s=>vig(s)&&inR(s.fecha)).forEach(s=>s.lineas.forEach(ln=>ln.allocs.forEach(a=>{if(ids.has(a.lot)){const r=add(ln.prod);r.vendido+=a.qty;r.monto+=Math.round(a.qty*ln.precio)}})));
  S.moves.filter(m=>m.tipo==='merma'&&ids.has(m.lot)&&inR(m.fecha)).forEach(m=>add(m.prod).merma+=-m.qty);
  const pr=PR(prodId);const monto=Object.values(by).reduce((a,r)=>a+r.monto,0);const com=Math.round(monto*(pr.comision??S.cfg.comision)/100);
  return {by,monto,comision:com,neto:monto-com,pct:pr.comision??S.cfg.comision};
}
function viewProd(){
  if(!lf.prod)lf.prod=S.producers.find(p=>p.tipo==='productor')?.id||'';
  const L=lf.prod?liqCalc(lf.prod,lf.desde,lf.hasta):null;
  return head('Productores y liquidaciones','Consignación: neto = vendido − comisión. La merma no se paga.',`<button class="btn pri" onclick="editProducer()">${ic('plus',18)}Nuevo productor</button>`)+
  `<div class="grid g3 stack"><div class="card"><h3>Productores y proveedores</h3><div class="rows">${S.producers.map(p=>`<div style="cursor:pointer" onclick="editProducer('${p.id}')"><span class="ico ${p.tipo==='productor'?'p':'o'}">${esc(p.nombre[0])}</span><div class="grid-0 grow"><b>${esc(p.nombre)}</b><span>${p.tipo} · ${p.tipo==='productor'?p.comision+'% comisión':'compra directa'}</span></div></div>`).join('')}</div></div>
  <div class="card span2"><h3>Liquidación</h3>
    <div class="row" style="flex-wrap:wrap"><div class="f"><label>Productor</label><select class="in" onchange="lf.prod=this.value;render()">${S.producers.filter(p=>p.tipo==='productor').map(p=>`<option value="${p.id}" ${lf.prod===p.id?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select></div>
    <div class="f"><label>Desde</label><input class="in" type="date" value="${lf.desde}" onchange="lf.desde=this.value;render()"></div><div class="f"><label>Hasta</label><input class="in" type="date" value="${lf.hasta}" onchange="lf.hasta=this.value;render()"></div></div>
    ${L?`<div class="scroll"><table class="tbl"><thead><tr><th>Producto</th><th class="right">Recibido</th><th class="right">Vendido</th><th class="right">Merma</th><th class="right">Monto vendido</th></tr></thead><tbody>${Object.entries(L.by).map(([pid,r])=>{const p=P(pid);return `<tr><td>${esc(p.nombre)}</td><td class="right num">${qtyFmt(r.recibido,p.unidad)}</td><td class="right num">${qtyFmt(r.vendido,p.unidad)}</td><td class="right num">${qtyFmt(r.merma,p.unidad)}</td><td class="right num">${clp(r.monto)}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">Sin movimientos en el periodo</td></tr>'}</tbody></table></div>
    <div class="grid g3" style="margin-top:14px"><div class="card kpi" style="background:var(--panel)"><div class="lbl">Vendido</div><div class="val num" style="font-size:24px">${clp(L.monto)}</div></div><div class="card kpi" style="background:var(--panel)"><div class="lbl">Comisión ${L.pct}%</div><div class="val num" style="font-size:24px">− ${clp(L.comision)}</div></div><div class="card kpi hero"><div class="lbl">Neto a pagar</div><div class="val num" style="font-size:24px">${clp(L.neto)}</div></div></div>
    <div class="acts"><button class="btn pri" ${L.monto?'':'disabled'} onclick="saveLiq()">Generar liquidación</button></div>`:'<div class="empty">Crea un productor primero</div>'}
    <h3 style="margin-top:18px">Liquidaciones emitidas</h3><div class="scroll"><table class="tbl"><thead><tr><th>Fecha</th><th>Productor</th><th>Periodo</th><th class="right">Neto</th><th>Estado</th><th></th></tr></thead><tbody>
    ${S.liqs.slice().reverse().map(l=>`<tr><td>${fdate(l.fecha)}</td><td>${esc(PR(l.prod).nombre)}</td><td class="muted">${l.desde||'inicio'} a ${l.hasta||'hoy'}</td><td class="right num"><b>${clp(l.neto)}</b></td><td>${l.pagada?`<span class="pill ok">Pagada ${fdate(l.pagada)} · ${l.medio}</span>`:`<button class="btn sm" onclick="payLiq('${l.id}')">Marcar pagada</button>`}</td><td><button class="btn sm ghost" onclick="liqDoc('${l.id}')">PDF</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Sin liquidaciones</td></tr>'}</tbody></table></div>
  </div></div>`;
}
function saveLiq(){const L=liqCalc(lf.prod,lf.desde,lf.hasta);const l={id:uid('q'),prod:lf.prod,desde:lf.desde,hasta:lf.hasta,fecha:now(),...L,pagada:0,medio:''};S.liqs.push(l);audit('Genera liquidación',PR(l.prod).nombre,'',clp(l.neto));save();render();liqDoc(l.id)}
function payLiq(id){modal(`<h2>Registrar pago</h2><div class="f"><label>Medio</label><select id="pm" class="in"><option>transferencia</option><option>efectivo</option></select></div><div class="acts"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="const l=S.liqs.find(x=>x.id==='${id}');l.pagada=now();l.medio=$('#pm').value;audit('Paga liquidación',PR(l.prod).nombre,'pendiente','pagada');save();closeModal();render()">Confirmar</button></div>`)}

let gm='';
const monthName=mk=>{const [y,m]=mk.split('-');return ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][+m-1]+' '+y};
const monthPick=(v,cb)=>`<input class="in" type="month" style="max-width:200px" value="${v}" max="${monthKey(now())}" onchange="${cb}=this.value||monthKey(now());render()">`;
const fixedFor=mk=>S.fixed.filter(f=>f.desde<=mk&&(!f.hasta||f.hasta>=mk));
const varFor=mk=>S.expenses.filter(e=>monthKey(e.fecha)===mk);
const prevMonth=mk=>{const [y,m]=mk.split('-').map(Number);return m===1?`${y-1}-12`:`${y}-${pad2(m-1)}`};
const FIX_CATS=['Arriendo','Sueldos','Luz y agua','Internet / teléfono','Patente','Otros fijos'];
const VAR_CATS=['Compra de gamelas','Flete','Combustible','Mantención','Bolsas / insumos','Otros'];
function viewGastos(){
  if(!gm)gm=monthKey(now());
  const fx=fixedFor(gm),vr=varFor(gm).sort((a,b)=>b.fecha-a.fecha);

  const cur=gm===monthKey(now());

   <div class="card"><h3>Gastos fijos<span class="pill mute">se replican cada mes</span></h3><div class="rows">${fx.map(f=>`<div><span class="ico o">${esc(f.cat[0])}</span><div class="grow"><b>${esc(f.desc||f.cat)}</b><span>${esc(f.cat)} · desde ${monthName(f.desde)}${f.hasta?' hasta '+monthName(f.hasta):''}</span></div><b class="num">${clp(f.monto)}</b><button class="btn sm ghost" onclick="editFixed('${f.id}')">Editar</button></div>`).join('')||'<div class="empty">Sin gastos fijos</div>'}</div></div>
